server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: jobpilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobpilot}
    username: ${DB_USER:jobpilot}
    password: ${DB_PASSWORD:jobpilot}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      # FR1.1：单文件 ≤ 5MB；FR2.8：截图最多 5 张，整体上限放宽到 30MB；
      # FR4.1：面试音频 ≤ 100MB，request 留出 multipart 边界余量
      max-file-size: 100MB
      max-request-size: 120MB

  jackson:
    default-property-inclusion: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    # AES-GCM 主密钥，仅从环境变量注入，不得入库、不得提交（FRX.10）
    secret-key: ${APP_SECRET_KEY:}
  storage:
    # 本地磁盘存储根目录（FR1.4：FileStorage 接口隔离）
    root: ${STORAGE_ROOT:./data/files}
  async:
    # 有界线程池，避免多任务并发触发厂商限流（§6.3）
    core-pool-size: ${ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${ASYNC_QUEUE_CAPACITY:20}
    # ASR 长任务独立线程池（FR4.8），避免堵住普通异步任务
    asr-core-pool-size: ${ASYNC_ASR_CORE_POOL_SIZE:1}
    asr-max-pool-size: ${ASYNC_ASR_MAX_POOL_SIZE:2}
    asr-queue-capacity: ${ASYNC_ASR_QUEUE_CAPACITY:5}
  asr:
    # OpenAI 兼容 /audio/transcriptions；base-url 需包含 /v1；未配置时音频复盘返回可操作提示
    base-url: ${ASR_BASE_URL:}
    api-key: ${ASR_API_KEY:}
    model: ${ASR_MODEL:whisper-1}
    language: ${ASR_LANGUAGE:zh}
    timeout-seconds: ${ASR_TIMEOUT_SECONDS:600}
  llm:
    # 首次启动且库内无 Provider 时导入一次（FRX.1），日常请在模型设置页维护
    bootstrap:
      provider-key: ${LLM_BOOTSTRAP_PROVIDER_KEY:}
      label: ${LLM_BOOTSTRAP_LABEL:}
      base-url: ${LLM_BOOTSTRAP_BASE_URL:}
      api-key: ${LLM_BOOTSTRAP_API_KEY:}
      model: ${LLM_BOOTSTRAP_MODEL:}
    # 上下文组装：最多携带最近 N 条历史消息（§6.2）
    max-history-messages: ${LLM_MAX_HISTORY_MESSAGES:50}
    # NFR7：单次调用 token 硬上限
    max-tokens: ${LLM_MAX_TOKENS:4096}

logging:
  # traceId 贯穿全链路（NFR2）
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.jobpilot: INFO
