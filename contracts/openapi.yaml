        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LlmUsageResponse'

    # ---------- 提示词工作台（1.22.0） ----------

    PromptVersionSummary:
      type: object
      required: [versionNo, source, status, contentHash]
      properties:
        versionNo:
          type: integer
          description: 内置默认固定为 0；DB 版本从 1 开始
          example: 1
        source:
          type: string
          enum: [BUILTIN, DB]
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        contentHash:
          type: string
          description: SHA-256(system + 分隔线 + user)，用于影响面提示
        note:
          type: [string, "null"]
        createdAt:
          type: [string, "null"]
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time

    PromptSummary:
      type: object
      required: [key, name, category, description, outputMode, modelScope, hasEvalCorpus,
                 affectedFunctions, placeholders, requiredFields, activeVersion, builtinVersion, hasDraft]
      properties:
        key:
          type: string
          description: 提示词分组 key
          example: resume-analysis
        name:
          type: string
          example: 简历分析
        category:
          type: string
          example: 档案
        description:
          type: string
        outputMode:
          type: string
          enum: [JSON, TEXT]
        modelScope:
          type: string
          enum: [SCENE, GLOBAL, SESSION]
          description: SESSION 表示使用会话创建时的模型（模拟面试追问）
        scene:
          type: [string, "null"]
          description: LlmScene 名称；GLOBAL/SESSION 时为空
        evalScene:
          type: [string, "null"]
          description: 评测场景 key；无评测语料时为空
        hasEvalCorpus:
          type: boolean
        affectedFunctions:
          type: array
          description: 该提示词影响的功能
          items:
            type: string
        placeholders:
          type: array
          items:
            type: string
        requiredFields:
          type: array
          description: 发布时必须仍出现在 system 中的 JSON 字段名
          items:
            type: string
        activeVersion:
          $ref: '#/components/schemas/PromptVersionSummary'
        builtinVersion:
          type: string
          description: 代码内置版本号，如 resume-analysis-v3
        hasDraft:
          type: boolean
        updatedAt:
          type: [string, "null"]
          format: date-time

    PromptVersionDetail:
      allOf:
        - $ref: '#/components/schemas/PromptVersionSummary'
        - type: object
          required: [systemContent, userContent]
          properties:
            systemContent:
              type: string
            userContent:
              type: string

    PromptValidation:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    PromptDetail:
      allOf:
        - $ref: '#/components/schemas/PromptSummary'
        - type: object
          required: [active, builtIn, validation]
          properties:
            active:
              $ref: '#/components/schemas/PromptVersionDetail'
            builtIn:
              $ref: '#/components/schemas/PromptVersionDetail'
              description: 代码内置默认，用于 diff / 恢复内置
            draft:
              oneOf:
                - $ref: '#/components/schemas/PromptVersionDetail'
                - type: 'null'
            validation:
              $ref: '#/components/schemas/PromptValidation'
            suggestedEvalScenes:
              type: array
              description: 当前配置与基线不一致时建议重建的场景；空数组表示无需提示
              items:
                $ref: '#/components/schemas/PromptImpactSuggestion'

    SavePromptDraftRequest:
      type: object
      required: [systemContent, userContent]
      properties:
        systemContent:
          type: string
          maxLength: 20000
        userContent:
          type: string
          maxLength: 20000
        note:
          type: [string, "null"]
          maxLength: 200

    PublishPromptRequest:
      type: object
      properties:
        note:
          type: [string, "null"]
          maxLength: 200

    ResultPromptList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PromptSummary'

    ResultPromptDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PromptDetail'

    ResultPromptVersionDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PromptVersionDetail'

    ResultPromptVersionPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/PromptVersionSummary'

    # ---------- 评测运行（1.23.0） ----------

    EvalAssertionResult:
      type: object
      required: [layer, name, passed, detail]
      properties:
        layer:
          type: string
          enum: [L1, L2, L3]
        name:
          type: string
          example: requiredFields:overallScore
        passed:
          type: boolean
        detail:
          type: string
          description: 人读的断言说明，便于定位失败原因

    EvalMetrics:
      type: object
      description: 运行级聚合指标；旧导入基线缺少明细时对应字段为 null。
      properties:
        l1Total:
          type: [integer, "null"]
        l1Failed:
          type: [integer, "null"]
        l1PassRate:
          type: [number, "null"]
          description: 0~1 小数；L1 按用例计（任一 L1 断言失败即该用例失败）
        l2Total:
          type: [integer, "null"]
        l2Failed:
          type: [integer, "null"]
        l2PassRate:
          type: [number, "null"]
          description: 0~1 小数；L2 按断言条目计
        totalTokens:
          type: [integer, "null"]
        avgTokens:
          type: [number, "null"]
        avgElapsedMs:
          type: [number, "null"]
        p95ElapsedMs:
          type: [number, "null"]

    EvalCaseResult:
      type: object
      required: [scene, caseId, status, results]
      properties:
        scene:
          type: string
        caseId:
          type: string
        status:
          type: string
          enum: [PENDING, PASS, FAIL, GRACEFUL, ERROR, SKIPPED]
          description: FAIL 为质量失败，ERROR 为执行错误，两者分开计数
        l1Passed:
          type: [boolean, "null"]
        l2Passed:
          type: [boolean, "null"]
        l3Passed:
          type: [boolean, "null"]
        results:
          type: array
          items:
            $ref: '#/components/schemas/EvalAssertionResult'
        scores:
          type: object
          description: 结构化输出中的分数快照（如简历五维、复盘题分）
          additionalProperties:
            type: number
        tokens:
          type: [integer, "null"]
        elapsedMs:
          type: [integer, "null"]
        error:
          type: [string, "null"]

    EvalSceneModel:
      type: object
      required: [scene, providerKey, model]
      properties:
        scene:
          type: string
        providerKey:
          type: string
        model:
          type: string

    EvalScenePrompt:
      type: object
      required: [scene, promptKey, promptVersion, promptHash]
      properties:
        scene:
          type: string
        promptKey:
          type: string
        promptVersion:
          type: string
          description: 形如 resume-analysis-v3（内置）或 resume-analysis-db1（DB）
        promptHash:
          type: string

    EvalRunSummary:
      type: object
      required: [id, status, scenes, totalCases, completedCases, errorCases]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, CANCELLED]
        scenes:
          type: array
          items:
            type: string
        totalCases:
          type: integer
        completedCases:
          type: integer
        errorCases:
          type: integer
          description: 执行错误（ERROR）用例数，不含质量失败
        partial:
          type: boolean
          description: true 表示只重跑部分用例（ERROR 重试），不可作为基线、不参与完整对比
        error:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time

    EvalBaselineSummary:
      type: object
      description: 场景级基线（即被「设为基线」的那次运行）；P2 先定义供场景摘要引用，P3 复用。
      required: [id, scene, runId, label, providerKey, model, promptVersion, promptHash,
                 corpusHash, engineVersion, params, metrics, current, createdAt]
      properties:
        id:
          type: integer
          format: int64
        scene:
          type: string
        runId:
          type: integer
          format: int64
        label:
          type: [string, "null"]
          maxLength: 100
        providerKey:
          type: string
          description: 历史导入基线为 legacy（Provider 未知）
        model:
          type: string
        promptVersion:
          type: string
        promptHash:
          type: string
          description: 影响面提示用；不参与可比性判定
        corpusHash:
          type: string
        engineVersion:
          type: string
        params:
          type: object
          additionalProperties: true
        metrics:
          $ref: '#/components/schemas/EvalMetrics'
        current:
          type: boolean
        createdAt:
          type: string
          format: date-time

    EvalSceneSummary:
      type: object
      required: [scene, name, caseCount, corpusHash, promptKey, promptVersion, modelScope, rebuildReasons]
      properties:
        scene:
          type: string
          enum: [resume-analysis, jd-parse, review-analyze]
        name:
          type: string
        caseCount:
          type: integer
        corpusHash:
          type: string
        promptKey:
          type: string
        promptVersion:
          type: string
        modelScope:
          type: string
          enum: [SCENE, GLOBAL]
        providerKey:
          type: [string, "null"]
        model:
          type: [string, "null"]
        currentBaseline:
          oneOf:
            - $ref: '#/components/schemas/EvalBaselineSummary'
            - type: 'null'
        lastRun:
          oneOf:
            - $ref: '#/components/schemas/EvalRunSummary'
            - type: 'null'
        rebuildReasons:
          type: array
          description: 当前配置与当前基线不一致的原因；空数组表示无需重建提示
          items:
            type: string

    EvalRunDetail:
      allOf:
        - $ref: '#/components/schemas/EvalRunSummary'
        - type: object
          required: [cases, models, prompts]
          properties:
            cases:
              type: array
              items:
                $ref: '#/components/schemas/EvalCaseResult'
            models:
              type: array
              description: 启动时的模型快照；中途改配置不影响本次运行
              items:
                $ref: '#/components/schemas/EvalSceneModel'
            prompts:
              type: array
              description: 启动时的提示词快照
              items:
                $ref: '#/components/schemas/EvalScenePrompt'
            metrics:
              oneOf:
                - $ref: '#/components/schemas/EvalMetrics'
                - type: 'null'
            baselines:
              type: array
              description: 该运行已创建 / 关联的场景基线
              items:
                $ref: '#/components/schemas/EvalBaselineResult'

    CreateEvalRunRequest:
      type: object
      properties:
        scenes:
          type: array
          minItems: 1
          items:
            type: string
            enum: [resume-analysis, jd-parse, review-analyze]
        repeat:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
          description: 重复次数；>1 时用于稳定性观察
        sourceRunId:
          type: [integer, "null"]
          format: int64
          description: 部分重跑的源运行；与 scenes 二选一
        retryErrorsOnly:
          type: boolean
          default: false
          description: true 时只重跑源运行中 ERROR 的用例，新运行 partial=true

    ResultEvalSceneList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EvalSceneSummary'

    ResultEvalRunDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EvalRunDetail'

    ResultEvalRunPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/EvalRunSummary'

    # ---------- 基线对比（1.24.0） ----------

    EvalBaselineResult:
      type: object
      required: [scene, created]
      properties:
        scene:
          type: string
        created:
          type: boolean
          description: true 表示本次成功写入 / 更新基线
        baselineId:
          type: [integer, "null"]
          format: int64
        reason:
          type: [string, "null"]
          description: created=false 时的可读原因

    CreateEvalBaselineRequest:
      type: object
      required: [runId]
      properties:
        runId:
          type: integer
          format: int64
        label:
          type: [string, "null"]
          maxLength: 100

    EvalRunCompareSide:
      type: object
      description: |
        单侧运行摘要。多场景运行时 `providerKey` / `model` / `promptVersion` / `promptHash`
        取第一个场景作为展示代表；可比性仍逐场景校验。`baselineId` / `baselineLabel` 仅单场景运行有值。
      required: [runId, scene, providerKey, model, promptVersion, promptHash,
                 corpusHash, engineVersion, params, metrics]
      properties:
        runId:
          type: integer
          format: int64
        scene:
          type: string
          description: 多场景运行以 `+` 拼接
        providerKey:
          type: string
        model:
          type: string
        promptVersion:
          type: string
        promptHash:
          type: string
        corpusHash:
          type: string
        engineVersion:
          type: string
        params:
          type: object
          additionalProperties: true
        metrics:
          $ref: '#/components/schemas/EvalMetrics'
        baselineId:
          type: [integer, "null"]
          format: int64
        baselineLabel:
          type: [string, "null"]

    EvalCompareQuality:
      type: object
      description: 质量门禁：L1 按用例、L2 按断言条目；旧导入基线无明细时为 null。
      properties:
        l1PassRate:
          type: [number, "null"]
          description: 左侧运行的 L1 通过率
        l2PassRate:
          type: [number, "null"]
          description: 左侧运行的 L2 通过率
        l1Delta:
          type: [number, "null"]
          description: 右侧减左侧的 L1 通过率差
        l2Delta:
          type: [number, "null"]
          description: 右侧减左侧的 L2 通过率差
        l1Failed:
          type: [integer, "null"]
          description: 右侧运行的 L1 失败数
        l2Failed:
          type: [integer, "null"]
          description: 右侧运行的 L2 失败数

    EvalCompareRegression:
      type: object
      description: 回归变化计数；一个 case 可同时命中多项。
      properties:
        fixedCases:
          type: integer
        newFailedCases:
          type: integer
        scoreDriftCases:
          type: integer
          description: 绝对分差 >10 的 case 数
        tagChangedCases:
          type: integer
          description: 标签 Jaccard <0.7 的 case 数

    EvalCompareCost:
      type: object
      properties:
        leftTokens:
          type: [integer, "null"]
        rightTokens:
          type: [integer, "null"]
        delta:
          type: [integer, "null"]
        leftAvgTokens:
          type: [number, "null"]
        rightAvgTokens:
          type: [number, "null"]

    EvalCompareLatency:
      type: object
      properties:
        leftAvgMs:
          type: [number, "null"]
        rightAvgMs:
          type: [number, "null"]
        avgDelta:
          type: [number, "null"]
        leftP95Ms:
          type: [number, "null"]
        rightP95Ms:
          type: [number, "null"]
        p95Delta:
          type: [number, "null"]

    EvalCompareCase:
      type: object
      required: [caseId, leftStatus, rightStatus, changes]
      properties:
        caseId:
          type: string
        leftStatus:
          type: string
        rightStatus:
          type: string
        changes:
          type: array
          items:
            type: string
            enum: [FIXED, REGRESSED, SCORE_DRIFT, TAG_CHANGED, UNCHANGED]
        scoreDrift:
          type: [number, "null"]
        tagJaccard:
          type: [number, "null"]
        details:
          type: [string, "null"]

    EvalRunCompare:
      type: object
      required: [comparable, reasons, warnings, applicableDimensions, scene, left, right]
      properties:
        comparable:
          type: boolean
        reasons:
          type: array
          description: comparable=false 时的硬性原因
          items:
            type: string
        warnings:
          type: array
          description: 不阻断对比的提示，如历史基线 Provider 未知
          items:
            type: string
        applicableDimensions:
          type: array
          items:
            type: string
            enum: [QUALITY, SCORE_DRIFT, TAG_CHANGE, COST, LATENCY]
        scene:
          type: string
        left:
          $ref: '#/components/schemas/EvalRunCompareSide'
        right:
          $ref: '#/components/schemas/EvalRunCompareSide'
        quality:
          oneOf:
            - $ref: '#/components/schemas/EvalCompareQuality'
            - type: 'null'
        regression:
          oneOf:
            - $ref: '#/components/schemas/EvalCompareRegression'
            - type: 'null'
        cost:
          oneOf:
            - $ref: '#/components/schemas/EvalCompareCost'
            - type: 'null'
        latency:
          oneOf:
            - $ref: '#/components/schemas/EvalCompareLatency'
            - type: 'null'
        cases:
          type: array
          items:
            $ref: '#/components/schemas/EvalCompareCase'

    PromptImpactSuggestion:
      type: object
      required: [scene, caseCount, reasons]
      properties:
        scene:
          type: string
        caseCount:
          type: integer
        reasons:
          type: array
          items:
            type: string
        currentBaselineId:
          type: [integer, "null"]
          format: int64

    ResultEvalBaselinePage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/EvalBaselineSummary'

    ResultEvalBaselineResultList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EvalBaselineResult'

    ResultEvalBaselineSummary:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EvalBaselineSummary'

    ResultEvalRunCompare:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EvalRunCompare'
