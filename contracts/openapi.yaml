openapi: 3.1.0

info:
  title: 职点（JobPilot）API
  version: 1.8.0
  description: |
    **本文件是接口的唯一真实源。**

    前后端均以此为准：
    - 后端按本契约实现，并编写「契约一致性测试」断言实际接口与本文一致；
    - 前端用 `openapi-typescript` 从本文生成 TypeScript 类型，**禁止手写接口类型**；
    - 后端 springdoc 的输出仅用于比对，**不作为真实源**。

    ## 响应约定
    - 所有 JSON 接口统一返回 `Result<T>`：`{ code, message, data, traceId }`。
    - `code = 0` 表示成功；非 0 为业务错误码，同时 HTTP 状态码为 400 / 404 / 409 / 500。
    - `traceId` 贯穿请求全链路，用于日志排查（NFR2）。

    ## 分页约定
    - 列表接口统一使用 `page`（从 1 开始）/ `size`（默认 20，最大 100）。
    - 统一返回 `PageResult<T>`：`{ items, total, page, size }`。
    - 默认按创建时间倒序。

    ## 覆盖范围
    - **M1 全量**：模型配置（X1）、对话会话（M1 能力验证载体）、简历中心（F1 轨一）。
    - **M2 第一批**：场景级模型绑定（FRX.11）、公司最小 CRUD（F6 / F5 数据前置）、岗位库（F2：JD 导入解析 / 匹配评分 / 行情洞察）、简历版本对比（F7）。
    - **M2 第二批**：模拟面试（F3）、Offer 决策（F6）；F4 / F5 的接口在 M3 追加。
    - 场景枚举 `LlmScene` 一次性定义全部 7 个场景（含 M2 未落地的预留项），避免后续扩展改动枚举。
      JD 结构化解析与简历对比总结未列入枚举，使用全局默认，不参与场景级绑定。

    ## 实现状态标记
    M2 第一批与第二批（F3 / F6）已全部实现，后端 `ContractCoverageTest` 对「契约端点 = 实际控制器端点」做双向全等校验。
    后续里程碑新增路径可先用路径级 `x-implemented: false` 标记「已定义、待实现」，
    实现完成后删除标记即自动纳入双向全等校验，无需维护例外清单。

    ## 错误码补充（M2）
    - `40906` 公司名称已存在（`companies.name` UNIQUE）
    - `40905` 公司仍被岗位引用，禁止删除（先解除岗位关联；复用通用「资源被引用」码）
    - `40907` 简历分析未完成，无法参与对比（F7 依赖两份 COMPLETED 的分析结果）
    - `40908` JD 解析 / 匹配任务执行中，请等待完成
    - `40910` 简历分析任务执行中（FR1.5）
    - `40911` 面试任务执行中（出题 / 追问生成 / 评估），请等待完成
    - `40912` 面试会话已交卷或已评估，不可再操作
    - `40913` 当前面试会话状态不允许该操作
    - `40914` 保留组 Offer 已达上限（最多 4 个）

  contact:
    name: 职点（JobPilot）
  license:
    name: 私有项目（未授权）
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8080
    description: 本地开发环境

tags:
  - name: 模型配置
    description: Provider / Model 增删改查、连通测试、模型列举、全局默认、场景级绑定。配置存数据库，保存即生效。
  - name: 对话会话
    description: 会话内 Provider + Model 两级切换与流式对话；任务执行中禁止切换。
  - name: 简历
    description: 简历上传、解析、异步分析与报告查询。
  - name: 简历对比
    description: 手动选择两份已完成分析的简历，对比分数、优势短板与岗位方向，并由 LLM 总结改动得失（F7）。
  - name: 公司
    description: 公司最小 CRUD 与名称联想检索；为岗位库、Offer 决策与求职洞察提供统一公司数据（M2 不做模糊自动合并）。
  - name: 岗位库
    description: JD 导入与结构化解析、生命周期状态管理、简历-JD 匹配评分、行情洞察（F2）。
  - name: 模拟面试
    description: 结构化模拟面试：选方向或关联 JD、异步出题、逐题作答与追问、交卷后统一评估（F3）。
  - name: Offer 决策
    description: Offer 录入与 LLM 提取、保留 / 淘汰分组、同维度横向对比、前景与倾向分析（F6）。

security: []

paths:
  # ==========================================================
  # 模型配置 X1
  # ==========================================================

  /api/llm/providers:
    get:
      tags: [模型配置]
      operationId: listProviders
      summary: 查询 Provider 列表（含各自挂载的模型）
      description: 返回全部 Provider 及其模型，API Key 一律掩码显示。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProviderList'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [模型配置]
      operationId: createProvider
      summary: 新增 Provider
      description: 新建后立即可用，无需重启服务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: providerKey 已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    get:
      tags: [模型配置]
      operationId: getProvider
      summary: 查询单个 Provider 详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProvider'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [模型配置]
      operationId: updateProvider
      summary: 更新 Provider
      description: |
        `apiKey` 传空或省略表示**保持原密钥不变**；传入新值则整体覆写密文。
        更新后相关的内存客户端缓存会被精确失效，下一次调用即使用新配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模型配置]
      operationId: deleteProvider
      summary: 删除 Provider（级联删除其下所有模型）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该 Provider 正被进行中的会话或全局默认引用，不可删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}/test:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    post:
      tags: [模型配置]
      operationId: testProvider
      summary: 连通性测试
      description: |
        向上游发起一次最小调用，返回是否可用与耗时。
        **同时回显上游响应中的真实 `model` 字段**——用于识别网关的模型别名
        （不同配置名可能路由到同一后端）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestProviderRequest'
      responses:
        '200':
          description: 测试完成（无论连通与否均返回 200，结果看 success 字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultConnectivityTest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}/models:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    get:
      tags: [模型配置]
      operationId: listUpstreamModels
      summary: 从上游拉取可用模型列表
      description: 调用上游 `/v1/models`；失败时回退为库内已登记的模型，并在 `source` 中标注来源。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUpstreamModelList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [模型配置]
      operationId: createModel
      summary: 在 Provider 下新增模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该 Provider 下已存在同名模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}/models/{modelName}:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
      - $ref: '#/components/parameters/ModelName'
    put:
      tags: [模型配置]
      operationId: updateModel
      summary: 更新模型（改名请删除后重建）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模型配置]
      operationId: deleteModel
      summary: 删除模型
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该模型正被进行中的会话或全局默认引用，不可删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/global:
    get:
      tags: [模型配置]
      operationId: getGlobalSetting
      summary: 查询全局默认 Provider + Model
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultGlobalSetting'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [模型配置]
      operationId: updateGlobalSetting
      summary: 设置全局默认 Provider + Model
      description: 需校验该 Model 确实属于该 Provider，否则返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalSettingRequest'
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultGlobalSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 场景级模型绑定 FRX.11（M2）
  # ==========================================================

  /api/llm/scenes:
    get:
      tags: [模型配置]
      operationId: listSceneBindings
      summary: 查询全部场景的模型绑定与生效结果
      description: |
        返回 `LlmScene` 全部场景。未显式配置的场景 `inherited = true`，
        `effectiveProviderKey` / `effectiveModel` 取全局默认；全局默认也未配置时两者为 null。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSceneBindingList'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/scenes/{scene}:
    parameters:
      - $ref: '#/components/parameters/Scene'
    put:
      tags: [模型配置]
      operationId: bindSceneModel
      summary: 为场景指定 Provider + Model
      description: |
        - 目标 Provider 必须存在且启用，目标 Model 必须属于该 Provider 且启用，否则 **400**。
        - 保存即生效，后续该场景的调用按此绑定执行；`llm_call_logs` 仍记录实际使用的 Provider / Model。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindSceneModelRequest'
      responses:
        '200':
          description: 保存成功，返回该场景的最新绑定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSceneBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模型配置]
      operationId: unbindSceneModel
      summary: 清除场景绑定，回落全局默认
      description: 幂等：场景本就未配置时同样返回 200。
      responses:
        '200':
          description: 清除成功，返回回落后的生效配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSceneBinding'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 对话会话（M1 能力验证载体）
  # ==========================================================

  /api/chat/sessions:
    get:
      tags: [对话会话]
      operationId: listChatSessions
      summary: 会话分页列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [对话会话]
      operationId: createChatSession
      summary: 创建会话
      description: 未指定 Provider / Model 时，采用全局默认设置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [对话会话]
      operationId: getChatSession
      summary: 会话详情（含当前绑定的 Provider / Model 与状态）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [对话会话]
      operationId: deleteChatSession
      summary: 删除会话（级联删除其消息）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/sessions/{sessionId}/model:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [对话会话]
      operationId: switchChatModel
      summary: 切换会话的 Provider / Model（两级）
      description: |
        切换只改会话绑定，不迁移历史消息。

        **守卫规则（服务端判定，前端置灰仅作体验优化）**
        - 会话存在执行中的任务（`status = PROCESSING`）→ **409**，业务码 `40901`
        - 会话已锁定（`status = LOCKED`）→ **409**，业务码 `40902`
        - 目标 Model 不属于目标 Provider → **400**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchModelRequest'
      responses:
        '200':
          description: 切换成功，返回更新后的会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 执行中或已锁定，禁止切换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [对话会话]
      operationId: listChatMessages
      summary: 查询会话历史消息（按时间正序）
      description: 每条消息包含实际使用的 `llmProvider` / `llmModel`，用于追溯。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatMessageList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [对话会话]
      operationId: sendChatMessage
      summary: 发送消息（SSE 流式返回）
      description: |
        以 `text/event-stream` 流式返回，事件载荷为 JSON，格式见 `ChatStreamEvent`。

        常见事件序列：
        1. 一个或多个 `delta`（增量文本）
        2. 结尾 `done`（含 messageId / providerKey / model / token 用量）
        3. 失败时 `error` 事件

        **并发守卫**：会话处于 `PROCESSING` 时再次发送返回 **409**（业务码 `40901`）；
        会话已 `LOCKED` 返回 **409**（业务码 `40902`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: 流式响应（每个 `data:` 行是一个 ChatStreamEvent 的 JSON）
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 执行中或已锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 简历 F1（轨一）
  # ==========================================================

  /api/resumes:
    get:
      tags: [简历]
      operationId: listResumes
      summary: 简历分页列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [简历]
      operationId: uploadResume
      summary: 上传简历（文件或粘贴文本）
      description: |
        - `file` 与 `text` 二选一，**不可同时为空**。
        - 支持 PDF / DOCX / DOC / TXT，单文件 ≤ 5MB。
        - 以内容 SHA-256 去重：重复上传直接返回已有记录，`duplicated = true`，不重复触发分析。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 简历文件（与 text 二选一）
                text:
                  type: string
                  description: 粘贴的简历纯文本（与 file 二选一）
      responses:
        '200':
          description: 上传成功或命中已有记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 文件超过 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '415':
          description: 不支持的文件类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    get:
      tags: [简历]
      operationId: getResume
      summary: 简历详情（含解析出的纯文本）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [简历]
      operationId: deleteResume
      summary: 删除简历
      description: 硬删除，级联删除分析结果与岗位匹配结果，同时清理磁盘上的原始文件。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}/salary:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    put:
      tags: [简历]
      operationId: updateResumeSalary
      summary: 更新当前月薪与期望月薪
      description: |
        用户填写的值优先于 LLM 从简历提取的值，重新分析不会覆盖用户值。
        传入 null 表示清空对应用户值（回落为 LLM 提取值）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalaryRequest'
      responses:
        '200':
          description: 保存成功，返回合并后的最新分析状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeAnalysisStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}/analyze:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    post:
      tags: [简历]
      operationId: triggerResumeAnalysis
      summary: 触发或重试分析
      description: |
        异步任务，立即返回。前端随后轮询 `GET /api/resumes/{resumeId}/analysis`。

        - 当前已是 `PROCESSING` → **409**（业务码 `40910`）
        - 失败后重试会重置 `retryCount`
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeAnalysisStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 分析进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}/analysis:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    get:
      tags: [简历]
      operationId: getResumeAnalysis
      summary: 查询分析状态与报告（轮询端点）
      description: |
        `status` 为 `PENDING` / `PROCESSING` 时 `report` 为 null；
        `COMPLETED` 时返回完整报告；`FAILED` 时返回 `error` 与 `retryCount`。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeAnalysisStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 简历版本对比 F7（M2 第一批）
  # ==========================================================

  /api/resume-comparisons:
    post:
      tags: [简历对比]
      operationId: compareResumes
      summary: 对比两份简历（同步返回）
      description: |
        手动选择两份**分析已完成（COMPLETED）**的简历发起对比，不落库、不产生历史记录（FR7.5）。

        - 分数、五维、优势短板、岗位方向的变化由本地计算，结果稳定可复现。
        - `summary.content` 由一次 LLM 调用生成；失败时降级为 `degraded = true`、`content = null`，
          本地对比结果照常返回（§6.5 / §9 分层降级）。
        - 两次分析使用的模型或 Prompt 版本不同时，`summary.modelMismatch` / `summary.promptVersionMismatch` 置为 true，
          前端须标注「模型或 Prompt 版本不同，仅供参考」（FR7.4）。
        - `promptVersion` 为 null 表示该次分析未记录版本；与有值的一方比较时按不同处理（保守标注）。
        - `summary` 的 LLM 调用走全局默认（简历对比不属于 `LlmScene` 枚举），不参与场景级绑定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResumeComparisonRequest'
      responses:
        '200':
          description: 对比成功（含降级结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeComparison'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任一份简历分析未完成，无法对比（业务码 40907）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 公司最小 CRUD（M2，F5 / F6 数据前置）
  # ==========================================================

  /api/companies:
    get:
      tags: [公司]
      operationId: listCompanies
      summary: 公司分页列表 / 名称联想检索
      description: |
        `keyword` 对 `name` 做包含匹配，用于录入时的公司联想（FR5.3）。
        **仅返回候选供用户确认，禁止据此自动合并**。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          required: false
          description: 公司名包含匹配的关键词
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompanyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [公司]
      operationId: createCompany
      summary: 新增公司
      description: |
        `name` 全等查重（UNIQUE），已存在返回 **409**、业务码 `40906`。
        M2 不做模糊自动合并，重复名称需用户自行改名规避。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 公司名称已存在（业务码 40906）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    put:
      tags: [公司]
      operationId: updateCompany
      summary: 更新公司信息
      description: 改名时同样做全等查重，冲突返回 **409**、业务码 `40906`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 公司名称已存在（业务码 40906）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [公司]
      operationId: deleteCompany
      summary: 删除公司
      description: |
        硬删除。仍被岗位引用时返回 **409**、业务码 `40905`，需先解除岗位关联
        （M3 提供「合并公司」作为补救路径）。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 仍被岗位引用（业务码 40905）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 岗位库 F2（M2 第一批）
  # ==========================================================

  /api/job-positions:
    get:
      tags: [岗位库]
      operationId: listJobPositions
      summary: 岗位分页列表
      description: 按创建时间倒序；`parseStatus != COMPLETED` 的记录字段可能为空，前端按解析中展示。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          description: 按生命周期状态筛选
          schema:
            $ref: '#/components/schemas/JobPositionStatus'
        - name: city
          in: query
          required: false
          description: 城市精确匹配
          schema:
            type: string
            maxLength: 64
        - name: keyword
          in: query
          required: false
          description: 岗位名或公司名包含匹配
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPositionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [岗位库]
      operationId: importJobPosition
      summary: 导入 JD（文件或粘贴文本），并触发异步结构化解析
      description: |
        - `file` 与 `text` 二选一，**不可同时为空**；文件支持 PDF / DOCX / DOC / TXT，≤ 5MB。
        - 创建后立即返回，`parseStatus = PENDING`；前端轮询 `GET /api/job-positions/{jobPositionId}` 直到 `COMPLETED` / `FAILED`。
        - 解析调用走全局默认（JD 解析不属于 `LlmScene` 枚举），不参与场景级绑定。
        - 解析出公司名后：与已有公司**全等同名**才自动关联，否则新建公司记录；不做模糊自动合并。
          需要改用其它公司时调用 `PUT /api/job-positions/{jobPositionId}` 指定 `companyId`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JD 文件（与 text 二选一）
                text:
                  type: string
                  description: 粘贴的 JD 纯文本（与 file 二选一）
      responses:
        '200':
          description: 导入成功，解析进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 文件超过 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '415':
          description: 不支持的文件类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-positions/batch-delete:
    post:
      tags: [岗位库]
      operationId: batchDeleteJobPositions
      summary: 批量删除岗位
      description: 硬删除，同时级联删除岗位匹配结果；行情洞察按剩余 JD 实时重算（FR2.6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteJobPositionsRequest'
      responses:
        '200':
          description: 删除成功（部分 id 不存在时忽略）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-positions/{jobPositionId}:
    parameters:
      - $ref: '#/components/parameters/JobPositionId'
    get:
      tags: [岗位库]
      operationId: getJobPosition
      summary: 岗位详情（含解析原文与结构化字段，轮询端点）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPositionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [岗位库]
      operationId: updateJobPosition
      summary: 更新岗位信息 / 生命周期状态 / 修正解析结果
      description: |
        全部字段可选，仅传入的字段被更新。
        - `status` 走 SAVED → APPLIED → INTERVIEWING → CLOSED 生命周期，可任意方向调整。
        - 结构化字段为用户修正入口，覆盖 LLM 解析值；`parseStatus` 不受影响。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobPositionRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [岗位库]
      operationId: deleteJobPosition
      summary: 删除岗位
      description: 硬删除，级联删除该岗位的匹配结果；行情洞察按剩余 JD 实时重算（FR2.6）。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-positions/{jobPositionId}/parse:
    parameters:
      - $ref: '#/components/parameters/JobPositionId'
    post:
      tags: [岗位库]
      operationId: retryJobPositionParse
      summary: 触发或重试结构化解析
      description: |
        异步任务，立即返回。手动重试会重置 `retryCount`；解析成功后覆盖结构化字段。
        解析中（`PROCESSING`）重复调用返回 **409**。
      responses:
        '200':
          description: 已触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPosition'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 解析进行中（业务码 40908）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-matches:
    get:
      tags: [岗位库]
      operationId: listJobMatches
      summary: 匹配结果分页列表
      description: 按创建时间倒序；`resumeId` 与 `jobPositionId` 可同时使用（取交集）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: resumeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: jobPositionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [岗位库]
      operationId: createJobMatch
      summary: 发起简历-JD 匹配评分（异步）
      description: |
        `(resumeId, jobPositionId)` 唯一：同一组合重复发起表示**重跑**，覆盖原结果并重置 `retryCount`。
        创建后立即返回，前端轮询 `GET /api/job-matches/{matchId}`。
        权重：技能匹配 50% / 经验匹配 30% / 加分项覆盖 20%，在 prompt 中显式声明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobMatchRequest'
      responses:
        '200':
          description: 已创建（或已重跑）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 简历或岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 已有匹配任务执行中（业务码 40908）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [岗位库]
      operationId: getJobMatch
      summary: 查询匹配状态与结果（轮询端点）
      description: |
        `status` 为 `PENDING` / `PROCESSING` 时 `detail` 为 null；
        `COMPLETED` 时返回完整结果；`FAILED` 时返回 `error` 与 `retryCount`。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-market/insights:
    get:
      tags: [岗位库]
      operationId: getJobMarketInsights
      summary: 行情洞察（实时统计）
      description: |
        基于**解析完成（COMPLETED）**的 JD 集合实时计算，不落快照表；JD 增删后结果立即变化（FR2.4 / FR2.6）。
        - 技能词频：必备与加分合并计数，归一化为小写去重后统计。
        - 薪资分布：以 `(salaryMin + salaryMax) / 2` 分桶，缺失薪资的 JD 不参与该维度。
        - 经验要求分布与岗位方向分布：按解析原文统计，**暂不做归一化**（同一含义的不同写法会分别计数）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMarketInsights'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 模拟面试 F3（M2 第二批，待实现）
  # ==========================================================

  /api/interview/directions:
    get:
      tags: [模拟面试]
      operationId: listInterviewDirections
      summary: 查询可选面试方向
      description: |
        方向由 `skill.meta.yml` 定义，新增方向只改技能配置，不改契约枚举。
        返回 direction 的 `key` 供创建会话时使用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewDirectionList'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions:
    get:
      tags: [模拟面试]
      operationId: listInterviewSessions
      summary: 模拟面试分页列表
      description: 按创建时间倒序；用于筛选与「继续未完成面试」（FR3.8）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: direction
          in: query
          required: false
          description: 按面试方向 key 筛选
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 按会话状态筛选
          schema:
            $ref: '#/components/schemas/InterviewSessionStatus'
        - name: createdFrom
          in: query
          required: false
          description: 创建时间下限（含）
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          description: 创建时间上限（含）
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [模拟面试]
      operationId: createInterviewSession
      summary: 创建模拟面试并异步生成题目
      description: |
        - `direction` 与 `jobPositionId` **至少填一个**；仅关联 JD 时，按 JD 内容选择最接近的方向出题。
        - 关联 `resumeId` 时简历题约 60%、方向题约 40%；未关联简历时全部为方向题（FR3.2）。
        - 创建后立即返回，`status = PREPARING`；前端轮询 `GET /api/interview-sessions/{sessionId}`
          直到 `IN_PROGRESS` / `FAILED`。
        - 出题场景为 `INTERVIEW_QUESTION`；未显式指定 `providerKey` / `model` 时按场景绑定取值，
          场景未绑定则回落全局默认。
        - 出题时注入同方向历史会话的 `topicSummary` 避免重复考察（FR3.3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewSessionRequest'
      responses:
        '200':
          description: 创建成功，题目生成中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 关联的简历 / 岗位不存在，或面试方向 key 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    get:
      tags: [模拟面试]
      operationId: getInterviewSession
      summary: 面试会话详情（含题目与作答状态，轮询端点）
      description: |
        `status` 为 `PREPARING` / `GENERATING` 时 `questions` 可能不完整；
        `IN_PROGRESS` 时可作答；`SUBMITTED` / `COMPLETED` 为锁定状态，禁止作答与切换模型。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSessionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模拟面试]
      operationId: deleteInterviewSession
      summary: 删除面试会话
      description: 硬删除，级联删除题目与评估结果（FR3.9）；进行中的异步任务检测到记录删除后终止。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/model:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    patch:
      tags: [模拟面试]
      operationId: switchInterviewSessionModel
      summary: 切换面试会话模型（Provider + Model 两级）
      description: |
        仅 `IN_PROGRESS` / `FAILED` 状态允许切换。
        `PREPARING` / `GENERATING` / `SUBMITTED`（任务执行中）返回 **409 / 40901**；
        `COMPLETED`（终态）返回 **409 / 40902**。
        切换只影响后续出题 / 追问 / 评估，不迁移已有题目（FR3.7 / FRX.5 / FRX.6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchModelRequest'
      responses:
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务执行中（40901）或会话已锁定（40902）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/questions/retry:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    post:
      tags: [模拟面试]
      operationId: retryInterviewQuestions
      summary: 重新生成题目（出题失败后重试）
      description: |
        仅 `FAILED` 状态可调用；重置 `retryCount` 并重新异步出题（自动重试仍 ≤ 3 次）。
        其他状态返回 **409 / 40913**。
      responses:
        '200':
          description: 已重新触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前状态不允许重试（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/questions/{questionIndex}/answer:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
      - $ref: '#/components/parameters/QuestionIndex'
    post:
      tags: [模拟面试]
      operationId: answerInterviewQuestion
      summary: 提交单题作答
      description: |
        - 仅 `IN_PROGRESS` 且该题 `answerStatus = UNANSWERED` 时可作答。
          任务执行中（`PREPARING` / `GENERATING` / `SUBMITTED`）返回 **409 / 40911**；
          已评估终态返回 **409 / 40912**；题目已作答 / 已跳过返回 **409 / 40913**。
        - 主问题作答后按 `followUpCount` 异步生成追问，会话短暂进入 `GENERATING`；前端轮询会话详情。
        - 同一主问题链的追问串行进行，链上题目全部作答 / 跳过后才进入下一主问题（FR3.4）。
        - 交卷后答案不可修改（FR3.6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInterviewQuestionRequest'
      responses:
        '200':
          description: 作答已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 会话或题目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 当前状态不允许作答（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/questions/{questionIndex}/skip:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
      - $ref: '#/components/parameters/QuestionIndex'
    post:
      tags: [模拟面试]
      operationId: skipInterviewQuestion
      summary: 跳过题目
      description: |
        - 跳过主问题时不再生成其追问链；跳过追问时按配置继续下一追问或下一主问题。
        - 跳过题计 0 分并标注「未作答」，不生成逐题点评（FR3.5）。
        - 任务执行中（`PREPARING` / `GENERATING` / `SUBMITTED`）返回 **409 / 40911**；
          已评估终态返回 **409 / 40912**；题目已作答 / 已跳过返回 **409 / 40913**。
      responses:
        '200':
          description: 已跳过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewQuestion'
        '404':
          description: 会话或题目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 当前状态不允许跳过（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/submit:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    post:
      tags: [模拟面试]
      operationId: submitInterviewSession
      summary: 交卷并异步生成评估报告
      description: |
        - 仅 `IN_PROGRESS` 且至少存在一道题目时可交卷；未作答题目按 FR3.5 记 0 分。
        - 交卷后会话锁定为 `SUBMITTED`，答案不可修改；评估完成后 `status = COMPLETED`（FR3.6 / FRX.6）。
        - 评估场景为 `INTERVIEW_EVALUATE`；失败原因通过评估接口的 `error` 查看。
        - 出题 / 追问 / 评估执行中返回 **409 / 40911**；已交卷或已评估返回 **409 / 40912**；
          无题目等非法状态返回 **409 / 40913**。
      responses:
        '200':
          description: 已交卷，评估进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务执行中（40911）或当前状态不允许交卷（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/evaluation:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    get:
      tags: [模拟面试]
      operationId: getInterviewEvaluation
      summary: 查询评估状态与报告（轮询端点）
      description: |
        `status` 为 `PENDING` / `PROCESSING` 时报告字段为空；`COMPLETED` 返回完整报告；
        `FAILED` 返回 `error` 与 `retryCount`。逐题得分与点评在会话详情的 `questions` 中返回。
        会话未交卷时返回 **409 / 40913**。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewEvaluation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未交卷，尚无评估（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # Offer 决策 F6（M2 第二批，待实现）
  # ==========================================================

  /api/offers:
    get:
      tags: [Offer 决策]
      operationId: listOffers
      summary: Offer 分页列表
      description: 按创建时间倒序；可按保留组 / 淘汰组筛选（FR6.2）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: group
          in: query
          required: false
          description: 按分组筛选
          schema:
            $ref: '#/components/schemas/OfferGroup'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Offer 决策]
      operationId: createOffer
      summary: 新增 Offer
      description: |
        - `companyId` 与 `jobPositionId` **至少填一个**；仅填岗位时自动带出所属公司（FR6.6）。
        - 默认进入保留组；保留组最多 4 个，超出返回 **409 / 40914**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 关联的公司或岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 保留组已达上限（40914）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/extract:
    post:
      tags: [Offer 决策]
      operationId: extractOffer
      summary: 从文本或图片提取 Offer 字段（不落库）
      description: |
        - `text` 与 `image` 二选一，不可同时为空；图片支持 PNG / JPEG / WEBP，≤ 5MB。
        - 解析结果供用户修正后调用创建 / 更新接口，本次**不落库**（FR6.1）。
        - 图片提取要求当前模型支持图片输入；不支持时返回 400 并引导改用文本粘贴。
        - 提取使用全局默认模型（不在 `LlmScene` 枚举内）；正式的 Offer 前景分析走 `OFFER_ANALYZE` 场景。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: 粘贴的 Offer 文本（与 image 二选一）
                image:
                  type: string
                  format: binary
                  description: Offer 截图（与 text 二选一）
      responses:
        '200':
          description: 提取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferExtraction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 图片超过 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '415':
          description: 不支持的图片类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/comparison:
    get:
      tags: [Offer 决策]
      operationId: getOfferComparison
      summary: 保留组 Offer 同维度对比
      description: |
        返回保留组全部 Offer（最多 4 个）按**固定维度与固定顺序**排列的对比矩阵（FR6.3）：
        - 同一行永远对应同一字段，禁止跨字段错位；
        - 缺失值统一为字符串「未填写」；
        - 保留组为空时 `columns` 与 `rows` 均为空数组。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferComparison'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      tags: [Offer 决策]
      operationId: getOffer
      summary: Offer 详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Offer 决策]
      operationId: updateOffer
      summary: 更新 Offer（含保留 / 淘汰分组调整）
      description: |
        全部字段可选：不传表示不修改，传 `null` 表示清空。
        移动到保留组时若除当前 Offer 外已有 4 个保留 Offer，返回 **409 / 40914**；可在保留组 / 淘汰组之间随时移动、反悔（FR6.2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Offer 或关联的公司 / 岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 保留组已达上限（40914）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Offer 决策]
      operationId: deleteOffer
      summary: 删除 Offer
      description: 硬删除。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/{offerId}/analyze:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      tags: [Offer 决策]
      operationId: analyzeOffer
      summary: 生成前景与决策倾向分析（同步）
      description: |
        基于关联公司 / 岗位资料与用户填写字段生成分析（FR6.4 / FR6.5）：
        - 默认 `webSearch = false`，结果标注「基于所给资料」；
        - 开启联网搜索需当前 Provider 支持，返回 `sources` 标注来源；
        - 使用场景 `OFFER_ANALYZE`；分析结果覆盖并持久化到该 Offer，详情接口返回最近一次结果。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeOfferRequest'
      responses:
        '200':
          description: 分析完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferAnalysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  parameters:
    ProviderKey:
      name: providerKey
      in: path
      required: true
      description: Provider 的内部唯一标识（如 `corp-gateway`）
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
        example: corp-gateway
    ModelName:
      name: modelName
      in: path
      required: true
      description: 模型名（上游返回的 model id）
      schema:
        type: string
        example: Qwen3.8-27B
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobPositionId:
      name: jobPositionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    InterviewSessionId:
      name: sessionId
      in: path
      required: true
      description: 模拟面试会话 ID
      schema:
        type: integer
        format: int64
    QuestionIndex:
      name: questionIndex
      in: path
      required: true
      description: 会话内的题目序号（主问题与追问统一顺序，从 1 开始）
      schema:
        type: integer
        minimum: 1
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Scene:
      name: scene
      in: path
      required: true
      description: LLM 调用场景
      schema:
        $ref: '#/components/schemas/LlmScene'
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数，默认 20，最大 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 参数校验失败（业务码 40001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    NotFound:
      description: 资源不存在（业务码 40401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    ServerError:
      description: 服务内部错误（业务码 50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'

  schemas:

    # ---------- 通用 ----------

    ResultVoid:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          description: 0 表示成功，非 0 为业务错误码
          example: 0
        message:
          type: string
          example: ok
        data:
          description: 成功时返回业务数据；失败时为空
        traceId:
          type: string
          example: 3f7a1c2e9b4d

    ResultProvider:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LlmProvider'

    ResultProviderList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LlmProvider'

    ResultModel:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LlmModel'

    ResultConnectivityTest:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConnectivityTest'

    ResultUpstreamModelList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UpstreamModelList'

    ResultGlobalSetting:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GlobalSetting'

    ResultChatSession:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ChatSession'

    ResultChatSessionPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChatSession'

    ResultChatMessageList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'

    ResultResumeUpload:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeUpload'
    
    ResultResumeDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeDetail'

    ResultResumePage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ResumeListItem'

    ResultResumeAnalysisStatus:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeAnalysisStatus'

    PageResult:
      type: object
      required: [total, page, size]
      properties:
        total:
          type: integer
          format: int64
          example: 42
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20

    # ---------- 模型配置 ----------

    LlmProvider:
      type: object
      required: [providerKey, label, baseUrl, enabled, sortOrder]
      properties:
        providerKey:
          type: string
          example: corp-gateway
        label:
          type: string
          description: 展示名称
          example: 公司内网网关
        baseUrl:
          type: string
          format: uri
          description: OpenAI 兼容端点，需包含 /v1
          example: http://192.168.101.200:3000/v1
        apiKeyMasked:
          type: string
          description: 掩码后的密钥，仅用于展示，**永不返回明文**
          example: sk-****MwMY
        enabled:
          type: boolean
        sortOrder:
          type: integer
          example: 10
        models:
          type: array
          items:
            $ref: '#/components/schemas/LlmModel'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LlmModel:
      type: object
      required: [modelName, label, enabled, isDefault, sortOrder]
      properties:
        modelName:
          type: string
          description: 上游模型名，请求时原样传给 /chat/completions
          example: Qwen3.8-27B
        label:
          type: string
          example: Qwen3.8 27B
        enabled:
          type: boolean
        isDefault:
          type: boolean
          description: 是否为该 Provider 下的默认模型
        sortOrder:
          type: integer
          example: 10
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProviderRequest:
      type: object
      required: [providerKey, label, baseUrl, apiKey]
      properties:
        providerKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
          description: 内部唯一标识，创建后不可修改
          example: corp-gateway
        label:
          type: string
          maxLength: 64
          example: 公司内网网关
        baseUrl:
          type: string
          format: uri
          maxLength: 512
          example: http://192.168.101.200:3000/v1
        apiKey:
          type: string
          description: 明文传入，服务端加密存储，绝不回显
          example: sk-xxxxxxxx
        enabled:
          type: boolean
          default: true
        sortOrder:
          type: integer
          default: 10

    UpdateProviderRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 64
        baseUrl:
          type: string
          format: uri
          maxLength: 512
        apiKey:
          type: string
          description: 省略或传空表示保持原密钥不变
        enabled:
          type: boolean
        sortOrder:
          type: integer

    CreateModelRequest:
      type: object
      required: [modelName, label]
      properties:
        modelName:
          type: string
          maxLength: 128
          example: Qwen3.8-27B
        label:
          type: string
          maxLength: 64
          example: Qwen3.8 27B
        enabled:
          type: boolean
          default: true
        isDefault:
          type: boolean
          default: false
        sortOrder:
          type: integer
          default: 10

    UpdateModelRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 64
        enabled:
          type: boolean
        isDefault:
          type: boolean
        sortOrder:
          type: integer

    TestProviderRequest:
      type: object
      properties:
        modelName:
          type: string
          description: 指定用于测试的模型；省略则使用该 Provider 的默认模型
          example: Qwen3.8-27B

    ConnectivityTest:
      type: object
      required: [success, latencyMs]
      properties:
        success:
          type: boolean
        latencyMs:
          type: integer
          format: int64
          example: 812
        message:
          type: string
          description: 失败时的原因摘要（不含密钥）
          example: HTTP 401 Unauthorized
        upstreamModel:
          type: string
          description: |
            上游响应中回显的**真实 model 字段**。
            与请求的 modelName 不一致说明网关存在模型别名（多个名字指向同一后端）。
          example: Qwen3.8-27B-W8A8-DFlash2

    UpstreamModelList:
      type: object
      required: [source, models]
      properties:
        source:
          type: string
          enum: [UPSTREAM, LOCAL_FALLBACK]
          description: UPSTREAM 表示实时拉取成功；LOCAL_FALLBACK 表示回退为库内登记列表
        models:
          type: array
          items:
            type: string
          example: [Qwen3.8-27B]

    GlobalSetting:
      type: object
      properties:
        defaultProviderKey:
          type: [string, "null"]
          example: corp-gateway
        defaultModel:
          type: [string, "null"]
          example: Qwen3.8-27B

    UpdateGlobalSettingRequest:
      type: object
      required: [defaultProviderKey, defaultModel]
      properties:
        defaultProviderKey:
          type: string
        defaultModel:
          type: string

    # ---------- 对话会话 ----------

    ChatSessionStatus:
      type: string
      description: |
        - `IDLE`：空闲，可发消息、可切换模型
        - `PROCESSING`：正在生成回答，**禁止切换**（409 / 40901）
        - `LOCKED`：终态锁定，**禁止切换与继续发消息**（409 / 40902）
      enum: [IDLE, PROCESSING, LOCKED]

    ChatSession:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: 新会话
        currentProviderKey:
          type: [string, "null"]
          example: corp-gateway
        currentModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        status:
          $ref: '#/components/schemas/ChatSessionStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateChatSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 128
          description: 省略时自动生成
        providerKey:
          type: string
          description: 省略则使用全局默认
        model:
          type: string
          description: 省略则使用全局默认

    SwitchModelRequest:
      type: object
      required: [providerKey, model]
      properties:
        providerKey:
          type: string
          example: corp-gateway
        model:
          type: string
          example: Qwen3.8-27B

    ChatRole:
      type: string
      enum: [USER, ASSISTANT]

    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/ChatRole'
        content:
          type: string
        llmProvider:
          type: [string, "null"]
          description: 实际使用的 Provider（仅 ASSISTANT 消息有值）
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          description: 实际使用的模型（仅 ASSISTANT 消息有值）
          example: Qwen3.8-27B
        traceId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 20000

    ChatStreamEvent:
      type: object
      description: 'SSE 事件载荷（每行 `data: {json}`）'
      required: [type]
      properties:
        type:
          type: string
          enum: [delta, done, error]
          description: |
            - `delta`：增量文本，读 `content`
            - `done`：本次回答结束，读 `messageId` / `providerKey` / `model` / `totalTokens`
            - `error`：出错，读 `code` / `message`
        content:
          type: string
          description: type = delta 时的增量文本
        messageId:
          type: integer
          format: int64
          description: type = done 时，落库的 assistant 消息 id
        providerKey:
          type: string
          description: type = done 时，实际使用的 Provider
        model:
          type: string
          description: type = done 时，实际使用的模型
        totalTokens:
          type: integer
          description: type = done 时，本次消耗的 token
        code:
          type: integer
          description: type = error 时的业务错误码
        message:
          type: string
          description: type = error 时的错误描述

    # ---------- 简历 ----------

    AnalyzeStatus:
      type: string
      description: 分析任务状态机
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    ResumeListItem:
      type: object
      required: [id, analyzeStatus, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: [string, "null"]
          description: 粘贴文本导入时为 null
        fileType:
          type: [string, "null"]
          example: PDF
        fileSize:
          type: [integer, "null"]
          format: int64
          example: 204800
        analyzeStatus:
          $ref: '#/components/schemas/AnalyzeStatus'
        overallScore:
          type: [integer, "null"]
          description: 分析完成后的总分，未完成时为 null
          example: 78
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResumeUpload:
      type: object
      required: [resume, duplicated]
      properties:
        resume:
          $ref: '#/components/schemas/ResumeListItem'
        duplicated:
          type: boolean
          description: true 表示命中已有的相同内容（SHA-256 去重），未重复触发分析

    ResumeDetail:
      allOf:
        - $ref: '#/components/schemas/ResumeListItem'
        - type: object
          properties:
            fileHash:
              type: string
              description: 内容 SHA-256
            resumeText:
              type: string
              description: Tika 解析并清洗后的纯文本
            analyzeError:
              type: [string, "null"]
            retryCount:
              type: integer
              example: 0

    ResumeAnalysisStatus:
      type: object
      required: [resumeId, status, retryCount]
      properties:
        resumeId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AnalyzeStatus'
        error:
          type: [string, "null"]
          description: 失败原因（截断至 500 字）
        retryCount:
          type: integer
          description: 已自动重试次数，上限 3
          example: 0
        report:
          oneOf:
            - $ref: '#/components/schemas/ResumeAnalysisReport'
            - type: "null"
          description: 仅 status = COMPLETED 时有值

    ResumeAnalysisReport:
      type: object
      required: [overallScore, dimensions]
      properties:
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 五维加权总分
          example: 78
        dimensions:
          type: array
          description: 五维评分，权重合计 100
          items:
            $ref: '#/components/schemas/AnalysisDimension'
        basicInfo:
          $ref: '#/components/schemas/ResumeBasicInfo'
        strengths:
          type: array
          description: 优势清单，带简历原句引用
          items:
            $ref: '#/components/schemas/QuoteItem'
        weaknesses:
          type: array
          description: 短板清单，带简历原句引用
          items:
            $ref: '#/components/schemas/QuoteItem'
        suggestions:
          type: array
          description: 逐条优化建议（原句 vs 优化句）
          items:
            $ref: '#/components/schemas/SuggestionItem'
        careerDirections:
          type: array
          description: 岗位方向推荐（轨一，3-5 个）
          items:
            $ref: '#/components/schemas/CareerDirection'
        llmProvider:
          type: string
          example: corp-gateway
        llmModel:
          type: string
          example: Qwen3.8-27B

    AnalysisDimension:
      type: object
      required: [key, label, score, weight]
      properties:
        key:
          type: string
          enum: [technicalDepth, projectQuality, engineeringAbility, expressionStructure, jobMatchPotential]
        label:
          type: string
          example: 技术深度
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 82
        weight:
          type: integer
          description: 权重百分比，五维合计 100
          enum: [30, 25, 20, 15, 10]

    ResumeBasicInfo:
      type: object
      properties:
        name:
          type: [string, "null"]
          example: 张三
        yearsOfExperience:
          type: [number, "null"]
          description: 工作年限（年）
          example: 7
        techDirection:
          type: [string, "null"]
          example: Java 后端
        currentMonthlySalary:
          type: [integer, "null"]
          description: 当前月薪（元/月）；用户填写值优先于 LLM 提取值
          example: 18000
        expectedMonthlySalary:
          type: [integer, "null"]
          description: 期望月薪（元/月）
          example: 25000

    UpdateSalaryRequest:
      type: object
      properties:
        currentMonthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: 当前月薪（元/月）；null 表示清空用户值
          example: 18000
        expectedMonthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: 期望月薪（元/月）；null 表示清空用户值
          example: 25000

    QuoteItem:
      type: object
      required: [quote, comment]
      properties:
        quote:
          type: string
          description: 简历原句
          example: 负责订单系统重构
        comment:
          type: string
          description: 说明
          example: 未量化结果，缺少可验证的影响数据

    SuggestionItem:
      type: object
      required: [original, improved]
      properties:
        original:
          type: string
          description: 简历原句
        improved:
          type: string
          description: 优化后的写法
        reason:
          type: string
          description: 这样改的理由

    CareerDirection:
      type: object
      required: [direction, matchReason]
      properties:
        direction:
          type: string
          example: Java 后端开发
        matchReason:
          type: string
          description: 为什么适合
        skillGaps:
          type: array
          description: 该方向上的技能差距
          items:
            type: string
        interviewFocus:
          type: array
          description: 面试准备重点（高频考点）
          items:
            type: string

    # ---------- 场景级模型绑定（M2 第一批） ----------

    LlmScene:
      type: string
      description: |
        LLM 调用场景（FRX.11）。枚举一次性定义全部 7 个场景；
        M2 第一批实际生效的是 `JOB_MATCH`，其余为 M2 第二批 / M3 预留。
        JD 结构化解析与简历对比总结不在枚举内，使用全局默认，不参与场景级绑定。
      enum:
        - RESUME_ANALYZE
        - CHAT
        - JOB_MATCH
        - INTERVIEW_QUESTION
        - INTERVIEW_EVALUATE
        - OFFER_ANALYZE
        - REVIEW_ANALYZE

    SceneBinding:
      type: object
      required: [scene, label, inherited]
      properties:
        scene:
          $ref: '#/components/schemas/LlmScene'
        label:
          type: string
          description: 场景的中文展示名
          example: 简历分析
        providerKey:
          type: [string, "null"]
          description: 显式绑定的 Provider；null 表示未配置
          example: corp-gateway
        model:
          type: [string, "null"]
          description: 显式绑定的模型；null 表示未配置
          example: Qwen3.8-27B
        inherited:
          type: boolean
          description: true 表示未显式配置，实际生效值来自全局默认
        effectiveProviderKey:
          type: [string, "null"]
          description: 实际生效的 Provider（未配置时为全局默认；全局默认也未配置则为 null）
          example: corp-gateway
        effectiveModel:
          type: [string, "null"]
          description: 实际生效的模型
          example: Qwen3.8-27B
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: 显式配置的最后更新时间；未配置时为 null

    BindSceneModelRequest:
      type: object
      required: [providerKey, model]
      properties:
        providerKey:
          type: string
          example: corp-gateway
        model:
          type: string
          example: Qwen3.8-27B

    ResultSceneBinding:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SceneBinding'

    ResultSceneBindingList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SceneBinding'

    # ---------- 公司（M2 第一批） ----------

    Company:
      type: object
      required: [id, name, jobPositionCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 公司名称，全局唯一
          example: 字节跳动
        intro:
          type: [string, "null"]
          description: 公司介绍文本（用于 Offer 前景分析与复盘上下文）
        tags:
          type: array
          description: 公司标签
          items:
            type: string
        jobPositionCount:
          type: integer
          description: 关联的岗位数量；大于 0 时禁止删除
          example: 3
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          example: 字节跳动
        intro:
          type: [string, "null"]
          maxLength: 10000
        tags:
          type: array
          items:
            type: string
            maxLength: 32

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        intro:
          type: [string, "null"]
          maxLength: 10000
        tags:
          type: array
          items:
            type: string
            maxLength: 32

    ResultCompany:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Company'

    ResultCompanyPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Company'

    # ---------- 岗位库 F2（M2 第一批） ----------

    JobPositionStatus:
      type: string
      description: 岗位生命周期状态，可任意方向调整；OFFERED 录用 / REJECTED 淘汰为两种终态结果
      enum: [SAVED, APPLIED, INTERVIEWING, OFFERED, REJECTED]

    JobPositionListItem:
      type: object
      required: [id, status, parseStatus, retryCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: [string, "null"]
          description: 岗位名；解析完成前可能为 null
          example: Java 后端开发工程师
        companyId:
          type: [integer, "null"]
          format: int64
        companyName:
          type: [string, "null"]
          example: 字节跳动
        city:
          type: [string, "null"]
          example: 上海
        salaryMin:
          type: [integer, "null"]
          description: 薪资下限（元/月）
          example: 20000
        salaryMax:
          type: [integer, "null"]
          description: 薪资上限（元/月）
          example: 35000
        experience:
          type: [string, "null"]
          description: 经验要求原文（不做归一化）
          example: 3-5 年
        education:
          type: [string, "null"]
          description: 学历要求原文
          example: 本科及以上
        status:
          $ref: '#/components/schemas/JobPositionStatus'
        remark:
          type: [string, "null"]
          maxLength: 200
          description: 用户备注（如一面 / 二面、简历淘汰 / 面试淘汰）
          example: 二面已约
        parseStatus:
          $ref: '#/components/schemas/AnalyzeStatus'
        retryCount:
          type: integer
          description: 解析已自动重试次数，上限 3
          example: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobPositionDetail:
      allOf:
        - $ref: '#/components/schemas/JobPositionListItem'
        - type: object
          properties:
            sourceType:
              type: string
              enum: [TEXT, FILE]
              description: 导入来源
            fileName:
              type: [string, "null"]
              description: 粘贴文本导入时为 null
            rawText:
              type: string
              description: JD 原文（文件导入时为解析清洗后的文本）
            mustHaveSkills:
              type: array
              description: 必备技能
              items:
                type: string
            niceToHaveSkills:
              type: array
              description: 加分技能
              items:
                type: string
            responsibility:
              type: [string, "null"]
              description: 职责摘要
            parseError:
              type: [string, "null"]
              description: 解析失败原因（截断至 500 字）
            llmProvider:
              type: [string, "null"]
              example: corp-gateway
            llmModel:
              type: [string, "null"]
              example: Qwen3.8-27B

    UpdateJobPositionRequest:
      type: object
      properties:
        title:
          type: [string, "null"]
          maxLength: 128
        companyId:
          type: [integer, "null"]
          format: int64
          description: null 表示解除公司关联
        city:
          type: [string, "null"]
          maxLength: 64
        salaryMin:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
        salaryMax:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
        experience:
          type: [string, "null"]
          maxLength: 64
        education:
          type: [string, "null"]
          maxLength: 64
        mustHaveSkills:
          type: array
          items:
            type: string
            maxLength: 64
        niceToHaveSkills:
          type: array
          items:
            type: string
            maxLength: 64
        responsibility:
          type: [string, "null"]
          maxLength: 5000
        status:
          $ref: '#/components/schemas/JobPositionStatus'
        remark:
          type: [string, "null"]
          maxLength: 200
          description: 用户备注；传空字符串表示清空

    BatchDeleteJobPositionsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64

    ResultJobPosition:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobPositionListItem'

    ResultJobPositionDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobPositionDetail'

    ResultJobPositionPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/JobPositionListItem'

    # ---------- 简历-JD 匹配（M2 第一批） ----------

    CreateJobMatchRequest:
      type: object
      required: [resumeId, jobPositionId]
      properties:
        resumeId:
          type: integer
          format: int64
        jobPositionId:
          type: integer
          format: int64

    MatchDimension:
      type: object
      required: [key, label, score, weight]
      properties:
        key:
          type: string
          enum: [skillMatch, experienceMatch, bonusCoverage]
          description: 技能匹配 / 经验匹配 / 加分项覆盖
        label:
          type: string
          example: 技能匹配
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 82
        weight:
          type: integer
          description: 权重百分比，三项合计 100
          enum: [50, 30, 20]

    JobMatchDetail:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          description: 分项评分，三项权重合计 100
          items:
            $ref: '#/components/schemas/MatchDimension'
        gaps:
          type: array
          description: 差距清单（简历未覆盖的必备项 / 弱项）
          items:
            type: string
        preparationAdvice:
          type: array
          description: 针对性准备建议
          items:
            type: string

    JobMatch:
      type: object
      required: [id, resumeId, jobPositionId, status, retryCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        resumeId:
          type: integer
          format: int64
        jobPositionId:
          type: integer
          format: int64
        jobPositionTitle:
          type: [string, "null"]
          description: 冗余展示字段，避免前端二次查询
          example: Java 后端开发工程师
        companyName:
          type: [string, "null"]
          example: 字节跳动
        status:
          $ref: '#/components/schemas/AnalyzeStatus'
        error:
          type: [string, "null"]
          description: 失败原因（截断至 500 字）
        retryCount:
          type: integer
          description: 已自动重试次数，上限 3
          example: 0
        overallScore:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: 总体匹配分（本地按权重计算），未完成时 null
          example: 76
        detail:
          oneOf:
            - $ref: '#/components/schemas/JobMatchDetail'
            - type: "null"
          description: 仅 status = COMPLETED 时有值
        llmProvider:
          type: [string, "null"]
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResultJobMatch:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobMatch'

    ResultJobMatchPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/JobMatch'

    # ---------- 行情洞察 F2（M2 第一批） ----------

    CountItem:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
          description: 分组名（薪资区间 / 经验要求原文 / 岗位方向原文）
          example: 20-30K
        count:
          type: integer
          example: 12

    SkillCountItem:
      type: object
      required: [skill, count]
      properties:
        skill:
          type: string
          description: 技能名（必填与加分合并，小写归一）
          example: redis
        count:
          type: integer
          example: 18

    JobMarketInsights:
      type: object
      required:
        [sampleSize, generatedAt, skillTop, salaryDistribution, experienceDistribution, directionDistribution]
      properties:
        sampleSize:
          type: integer
          description: 参与统计的 JD 数（仅解析完成的记录）
          example: 42
        generatedAt:
          type: string
          format: date-time
        skillTop:
          type: array
          description: 技能词频 Top 20
          items:
            $ref: '#/components/schemas/SkillCountItem'
        salaryDistribution:
          type: array
          description: 薪资分布（按 min/max 中位数分桶，单位元/月）
          items:
            $ref: '#/components/schemas/CountItem'
        experienceDistribution:
          type: array
          description: 经验要求分布（原文统计，不做归一化）
          items:
            $ref: '#/components/schemas/CountItem'
        directionDistribution:
          type: array
          description: 岗位方向分布（岗位名原文 Top 20，不做归一化）
          items:
            $ref: '#/components/schemas/CountItem'

    ResultJobMarketInsights:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobMarketInsights'

    # ---------- 简历版本对比 F7（M2 第一批） ----------

    CreateResumeComparisonRequest:
      type: object
      required: [baseResumeId, targetResumeId]
      properties:
        baseResumeId:
          type: integer
          format: int64
          description: 基准简历（较早版本）
        targetResumeId:
          type: integer
          format: int64
          description: 对比简历（较新版本），不得与 baseResumeId 相同

    ComparisonSide:
      type: object
      required: [resumeId, overallScore, analyzedAt]
      properties:
        resumeId:
          type: integer
          format: int64
        fileName:
          type: [string, "null"]
          description: 粘贴文本导入时为 null
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
        analyzedAt:
          type: string
          format: date-time
          description: 该份简历分析完成时间
        llmProvider:
          type: [string, "null"]
        llmModel:
          type: [string, "null"]
        promptVersion:
          type: [string, "null"]
          description: 该次分析使用的 Prompt 版本；M1 历史分析为 null（FR7.4）

    DimensionDelta:
      type: object
      required: [key, label, baseScore, targetScore, delta]
      properties:
        key:
          type: string
          enum: [technicalDepth, projectQuality, engineeringAbility, expressionStructure, jobMatchPotential]
        label:
          type: string
          example: 技术深度
        baseScore:
          type: integer
          minimum: 0
          maximum: 100
        targetScore:
          type: integer
          minimum: 0
          maximum: 100
        delta:
          type: integer
          description: targetScore - baseScore
          example: 6

    ComparisonSummary:
      type: object
      required: [content, modelMismatch, promptVersionMismatch, degraded]
      properties:
        content:
          type: [string, "null"]
          description: LLM 总结的改动优点与退步；降级时为 null
        modelMismatch:
          type: boolean
          description: 两份分析使用的模型不同，结果仅供参考（FR7.4）
        promptVersionMismatch:
          type: boolean
          description: 两份分析的 Prompt 版本不同（含一方未记录），结果仅供参考（FR7.4）
        degraded:
          type: boolean
          description: true 表示 LLM 总结失败，本地对比结果仍有效
        degradeReason:
          type: [string, "null"]
          description: 降级原因

    ResumeComparison:
      type: object
      required: [base, target, overallScoreDelta, dimensionDeltas, summary]
      properties:
        base:
          $ref: '#/components/schemas/ComparisonSide'
        target:
          $ref: '#/components/schemas/ComparisonSide'
        overallScoreDelta:
          type: integer
          description: target 总分 - base 总分
          example: 5
        dimensionDeltas:
          type: array
          description: 五维对比，固定顺序
          items:
            $ref: '#/components/schemas/DimensionDelta'
        strengthsAdded:
          type: array
          description: target 新增的优势（按 quote 文本比对）
          items:
            $ref: '#/components/schemas/QuoteItem'
        strengthsRemoved:
          type: array
          description: target 相比 base 不再具备的优势
          items:
            $ref: '#/components/schemas/QuoteItem'
        weaknessesAdded:
          type: array
          description: target 新增的短板
          items:
            $ref: '#/components/schemas/QuoteItem'
        weaknessesRemoved:
          type: array
          description: target 相比 base 已消除的短板
          items:
            $ref: '#/components/schemas/QuoteItem'
        directionsAdded:
          type: array
          description: target 新增的岗位方向
          items:
            type: string
        directionsRemoved:
          type: array
          description: target 不再推荐的岗位方向
          items:
            type: string
        summary:
          $ref: '#/components/schemas/ComparisonSummary'

    ResultResumeComparison:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeComparison'

    # ---------- 模拟面试 F3（M2 第二批） ----------

    InterviewSessionStatus:
      type: string
      description: |
        - `PREPARING`：初次出题中（含自动重试）
        - `IN_PROGRESS`：题目就绪，可作答
        - `GENERATING`：追问生成中（作答主问题后短暂状态）
        - `SUBMITTED`：已交卷，评估中 / 待评估
        - `COMPLETED`：评估完成（终态，禁止作答与切换）
        - `FAILED`：出题失败，可重试
      enum: [PREPARING, IN_PROGRESS, GENERATING, SUBMITTED, COMPLETED, FAILED]

    InterviewDirection:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: 方向标识，创建会话时传入
          example: java-backend
        label:
          type: string
          example: Java 后端
        description:
          type: [string, "null"]
          description: 方向说明（考察范围等）

    InterviewQuestionType:
      type: string
      description: 主问题 / 追问
      enum: [MAIN, FOLLOW_UP]

    InterviewQuestionDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]

    InterviewAnswerStatus:
      type: string
      description: 未作答 / 已作答 / 已跳过
      enum: [UNANSWERED, ANSWERED, SKIPPED]

    InterviewQuestion:
      type: object
      required: [questionIndex, type, content, difficulty, answerStatus, keyPoints]
      properties:
        questionIndex:
          type: integer
          minimum: 1
          description: 会话内统一顺序号（主问题与追问按实际呈现顺序编号）
          example: 3
        parentIndex:
          type: [integer, "null"]
          description: 追问所属主问题的 questionIndex；主问题为 null
          example: 2
        type:
          $ref: '#/components/schemas/InterviewQuestionType'
        content:
          type: string
          description: 题目正文
        topicSummary:
          type: [string, "null"]
          description: 知识点摘要，用于历史去重与后续聚合（FR3.3）
          example: JVM 垃圾回收
        difficulty:
          $ref: '#/components/schemas/InterviewQuestionDifficulty'
        answerStatus:
          $ref: '#/components/schemas/InterviewAnswerStatus'
        answer:
          type: [string, "null"]
          description: 用户作答原文；未作答或跳过为 null
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: 评估完成后有值；跳过 / 未作答记 0 分
        feedback:
          type: [string, "null"]
          description: 逐题点评；跳过 / 未作答为 null
        referenceAnswer:
          type: [string, "null"]
          description: 参考答案；跳过 / 未作答为 null
        keyPoints:
          type: array
          description: 答题关键点
          items:
            type: string
        llmProvider:
          type: [string, "null"]
          description: 生成该题实际使用的 Provider
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B

    InterviewSession:
      type: object
      required: [id, status, evaluateStatus, questionCount, followUpCount, answeredCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        direction:
          type: [string, "null"]
          description: 面试方向 key；仅关联 JD 时仍会回填匹配到的方向
          example: java-backend
        directionLabel:
          type: [string, "null"]
          example: Java 后端
        resumeId:
          type: [integer, "null"]
          format: int64
        resumeFileName:
          type: [string, "null"]
          description: 冗余展示字段
          example: 我的简历-v3.pdf
        jobPositionId:
          type: [integer, "null"]
          format: int64
        jobPositionTitle:
          type: [string, "null"]
          example: Java 后端开发工程师
        companyName:
          type: [string, "null"]
          example: 字节跳动
        status:
          $ref: '#/components/schemas/InterviewSessionStatus'
        evaluateStatus:
          $ref: '#/components/schemas/AnalyzeStatus'
        questionCount:
          type: integer
          description: 配置的主问题数量
          example: 8
        followUpCount:
          type: integer
          description: 每道主问题配置的追问数量（0 表示不追问）
          example: 1
        answeredCount:
          type: integer
          description: 已作答 + 已跳过题目数（含追问）
          example: 3
        currentProviderKey:
          type: [string, "null"]
          example: corp-gateway
        currentModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InterviewSessionDetail:
      allOf:
        - $ref: '#/components/schemas/InterviewSession'
        - type: object
          properties:
            error:
              type: [string, "null"]
              description: 出题失败原因（截断至 500 字）
            retryCount:
              type: integer
              description: 出题已自动重试次数，上限 3
              example: 0
            evaluateError:
              type: [string, "null"]
              description: 评估失败原因（截断至 500 字）
            evaluateRetryCount:
              type: integer
              description: 评估已自动重试次数，上限 3
              example: 0
            questions:
              type: array
              description: 已生成的题目，按 questionIndex 升序；出题中可能不完整
              items:
                $ref: '#/components/schemas/InterviewQuestion'

    CreateInterviewSessionRequest:
      type: object
      properties:
        direction:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
          description: 面试方向 key（来自 `GET /api/interview/directions`）；与 jobPositionId 至少填一个
          example: java-backend
        resumeId:
          type: [integer, "null"]
          format: int64
          description: 关联简历；填了则简历题约 60%
        jobPositionId:
          type: [integer, "null"]
          format: int64
          description: 关联岗位 JD；与 direction 至少填一个
        questionCount:
          type: integer
          minimum: 5
          maximum: 15
          default: 8
          description: 主问题数量
        followUpCount:
          type: integer
          minimum: 0
          maximum: 3
          default: 1
          description: 每道主问题的追问数量，0 表示不追问
        providerKey:
          type: string
          description: 省略时按 `INTERVIEW_QUESTION` 场景绑定取值，未绑定则回落全局默认；与 `model` 需同时提供
        model:
          type: string
          description: 与 `providerKey` 需同时提供

    AnswerInterviewQuestionRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 5000

    InterviewEvaluationCategory:
      type: object
      required: [key, label, score]
      properties:
        key:
          type: string
          description: 分类标识（由出题方向的知识体系定义）
          example: java-basics
        label:
          type: string
          example: Java 基础
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 78

    InterviewEvaluation:
      type: object
      required: [status, retryCount, categories, strengths, improvements]
      properties:
        status:
          $ref: '#/components/schemas/AnalyzeStatus'
        error:
          type: [string, "null"]
          description: 评估失败原因（截断至 500 字）
        retryCount:
          type: integer
          description: 评估已自动重试次数，上限 3
          example: 0
        overallScore:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: 总分（本地按分类得分加权计算），未完成时 null
          example: 76
        categories:
          type: array
          description: 分类得分；评估未完成时为空数组
          items:
            $ref: '#/components/schemas/InterviewEvaluationCategory'
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        summary:
          type: [string, "null"]
          description: 整体评语
        llmProvider:
          type: [string, "null"]
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        evaluatedAt:
          type: [string, "null"]
          format: date-time
          description: 评估完成时间；未完成时为 null

    ResultInterviewDirectionList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InterviewDirection'

    ResultInterviewSession:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewSession'

    ResultInterviewSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewSessionDetail'

    ResultInterviewSessionPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/InterviewSession'

    ResultInterviewQuestion:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewQuestion'

    ResultInterviewEvaluation:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewEvaluation'

    # ---------- Offer 决策 F6（M2 第二批） ----------

    OfferGroup:
      type: string
      description: 保留组 / 淘汰组；保留组最多 4 个
      enum: [KEEP, DROP]

    OfferTendency:
      type: string
      description: 值得接受 / 需要确认 / 建议放弃
      enum: [ACCEPT, CONFIRM, DECLINE]

    OfferAnalysis:
      type: object
      required: [tendency, reasons, prospect, risks, sources, basedOnProvidedMaterials, analyzedAt]
      properties:
        tendency:
          $ref: '#/components/schemas/OfferTendency'
        reasons:
          type: array
          description: 倾向理由
          items:
            type: string
        prospect:
          type: string
          description: 公司 / 岗位前景与成长空间分析
        risks:
          type: array
          description: 风险与需要确认的点
          items:
            type: string
        sources:
          type: array
          description: 联网搜索来源；未开启联网时为空数组
          items:
            type: string
        basedOnProvidedMaterials:
          type: boolean
          description: true 表示结论仅基于用户提供的资料（未联网）
        llmProvider:
          type: [string, "null"]
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        analyzedAt:
          type: string
          format: date-time

    Offer:
      type: object
      required: [id, group, benefits, allowances, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: [integer, "null"]
          format: int64
        companyName:
          type: [string, "null"]
          description: 冗余展示字段
          example: 字节跳动
        jobPositionId:
          type: [integer, "null"]
          format: int64
        jobPositionTitle:
          type: [string, "null"]
          example: Java 后端开发工程师
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
          description: 月薪总额（元/月）
          example: 30000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
          description: 底薪（元/月）
          example: 24000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: 绩效占比（%）
          example: 20
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
          description: 五险一金缴纳基数（原文，如“12000”或“按最低基数”）
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
          description: 五险一金缴纳比例（原文，如“10.5%”）
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
          description: 公积金缴纳基数（原文）
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
          description: 公积金缴纳比例（原文，如“12%”）
        twoDayWeekend:
          type: [boolean, "null"]
          description: 是否双休；null 表示未填写
        workHours:
          type: [string, "null"]
          maxLength: 64
          description: 上下班时间
          example: 10:00-19:00
        benefits:
          type: array
          description: 福利（如餐补、房补、免费班车）
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          description: 各项补贴
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
          description: 年终奖（原文，如“3 个月”）
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
          description: 季度奖（原文）
        remark:
          type: [string, "null"]
          maxLength: 500
        group:
          $ref: '#/components/schemas/OfferGroup'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OfferDetail:
      allOf:
        - $ref: '#/components/schemas/Offer'
        - type: object
          properties:
            analysis:
              oneOf:
                - $ref: '#/components/schemas/OfferAnalysis'
                - type: "null"
              description: 最近一次前景 / 倾向分析；未分析时为 null

    CreateOfferRequest:
      type: object
      description: |
        `companyId` 与 `jobPositionId` 至少填一个；仅填 jobPositionId 时自动带出所属公司。
        其余字段均为可选，缺失的对比维度统一显示「未填写」。
      properties:
        companyId:
          type: [integer, "null"]
          format: int64
        jobPositionId:
          type: [integer, "null"]
          format: int64
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
        twoDayWeekend:
          type: [boolean, "null"]
        workHours:
          type: [string, "null"]
          maxLength: 64
        benefits:
          type: array
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
        remark:
          type: [string, "null"]
          maxLength: 500
        group:
          $ref: '#/components/schemas/OfferGroup'

    UpdateOfferRequest:
      type: object
      description: |
        全部字段可选：不传表示不修改，传 `null` 表示清空。
        移动到保留组时若除当前 Offer 外已有 4 个保留 Offer，返回 409 / 40914。
      properties:
        companyId:
          type: [integer, "null"]
          format: int64
        jobPositionId:
          type: [integer, "null"]
          format: int64
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
        twoDayWeekend:
          type: [boolean, "null"]
        workHours:
          type: [string, "null"]
          maxLength: 64
        benefits:
          type: array
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
        remark:
          type: [string, "null"]
          maxLength: 500
        group:
          $ref: '#/components/schemas/OfferGroup'

    OfferExtraction:
      type: object
      description: LLM 从文本 / 图片提取的 Offer 草稿，所有字段均可能为 null，由用户修正后再保存。
      properties:
        companyName:
          type: [string, "null"]
          maxLength: 128
        jobPositionTitle:
          type: [string, "null"]
          maxLength: 128
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
        twoDayWeekend:
          type: [boolean, "null"]
        workHours:
          type: [string, "null"]
          maxLength: 64
        benefits:
          type: array
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
        remark:
          type: [string, "null"]
          maxLength: 500

    AnalyzeOfferRequest:
      type: object
      properties:
        webSearch:
          type: boolean
          default: false
          description: 是否联网搜索补充公司 / 岗位信息；默认关闭，需当前 Provider 支持

    OfferComparisonColumn:
      type: object
      required: [offerId, companyName, jobPositionTitle]
      properties:
        offerId:
          type: integer
          format: int64
        companyName:
          type: [string, "null"]
        jobPositionTitle:
          type: [string, "null"]

    OfferComparisonRow:
      type: object
      required: [key, label, values]
      properties:
        key:
          type: string
          description: 固定维度标识；行顺序固定，不随 Offer 变化
          enum:
            - monthlySalary
            - baseSalary
            - performanceRatio
            - socialInsurance
            - housingFund
            - twoDayWeekend
            - workHours
            - benefits
            - allowances
            - annualBonus
            - quarterlyBonus
            - remark
        label:
          type: string
          example: 月薪
        values:
          type: array
          description: 与 `columns` 顺序一一对应；缺失统一为「未填写」
          items:
            type: string

    OfferComparison:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          description: 保留组 Offer（最多 4 个）
          items:
            $ref: '#/components/schemas/OfferComparisonColumn'
        rows:
          type: array
          description: 固定维度与固定顺序的对比矩阵
          items:
            $ref: '#/components/schemas/OfferComparisonRow'

    ResultOfferDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferDetail'

    ResultOfferPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Offer'

    ResultOfferExtraction:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferExtraction'

    ResultOfferAnalysis:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferAnalysis'

    ResultOfferComparison:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferComparison'
