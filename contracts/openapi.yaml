openapi: 3.1.0

info:
  title: 面后（AfterRound）API
  version: 1.25.0
  description: |
    **本文件是接口的唯一真实源。**

    前后端均以此为准：
    - 后端按本契约实现，并编写「契约一致性测试」断言实际接口与本文一致；
    - 前端用 `openapi-typescript` 从本文生成 TypeScript 类型，**禁止手写接口类型**；
    - 后端 springdoc 的输出仅用于比对，**不作为真实源**。

    ## 响应约定
    - 所有 JSON 接口统一返回 `Result<T>`：`{ code, message, data, traceId }`。
    - `code = 0` 表示成功；非 0 为业务错误码，同时 HTTP 状态码为 400 / 404 / 409 / 500。
    - `traceId` 贯穿请求全链路，用于日志排查（NFR2）。

    ## 分页约定
    - 列表接口统一使用 `page`（从 1 开始）/ `size`（默认 20，最大 100）。
    - 统一返回 `PageResult<T>`：`{ items, total, page, size }`。
    - 默认按创建时间倒序。

    ## 覆盖范围
    - **M1 全量**：模型配置（X1）、对话会话（M1 能力验证载体）、简历中心（F1 轨一）。
    - **M2 第一批**：场景级模型绑定（FRX.11）、公司最小 CRUD（F6 / F5 数据前置）、岗位库（F2：JD 导入解析 / 匹配评分 / 行情洞察）、简历版本对比（F7）。
    - **M2 第二批**：模拟面试（F3）、Offer 决策（F6）。
    - **M3 1.9.0（契约先行）**：投递档案（F8）、真实面试档案与复盘（F4）、改进动作（F5 闭环）。
      1.9.1 完成 JD 截图导入；1.9.2 完成投递档案与 Offer 归因链；1.9.3 完成真实面试轮次；
      1.9.4 完成复盘会话、结构化分析、受控词表与改进动作（M3 1.9.0 端点全部实现）；
      1.9.5 补充音频转写重试端点（`/review-sessions/{id}/transcribe`），落实 FR4.8 的 ASR 手动重试。
    - **M3 1.10.0（后续）**：跨场洞察（F5）在真实数据形状稳定后追加，避免过早固化聚合口径。
    - **1.21.0**：复盘音频可选清理（`DELETE /review-sessions/{id}/audio`），落实 NFR7「分析后可选清理音频」，
      只删除磁盘音频与音频元信息，保留转写与分析。
    - **1.21.1（修订）**：补记 1.19.0 遗漏的复盘列表 `keyword` 查询参数；音频清理限定「分析完成后」；
      修正洞察 AI 总结的样本不足描述与面试轮次 PATCH 摘要。
    - **1.22.0（提示词工作台）**：新增 8 个提示词端点（查看 / 草稿 / 发布 / 回滚 / 版本），
      发布后热更新；保存与发布校验占位符和该场景必需的 JSON 字段；发布不触发评测。
    - **1.23.0（评测运行器）**：新增 5 个评测端点（场景列表 / 创建运行 / 运行列表 / 运行详情 / 取消），
      运行为异步任务，使用启动时的提示词与模型快照；始终由用户主动触发，发布或改配置不自动评测。
    - **1.24.0（基线对比）**：新增 4 个端点（基线列表 / 从已完成运行设为基线 / 设为当前 / 运行对比），
      基线是被「设为基线」的那次运行，只贴标签不重跑；对比对象是 run vs run，提示词不参与可比性。
    - **1.25.0（基线列表分页）**：`GET /api/llm/eval/baselines` 统一分页（`page` / `size`，默认 20，最大 100），
      当前基线在前，其余按创建时间倒序；响应改为 `PageResult<EvalBaselineSummary>`，与列表分页约定一致。
    - 场景枚举 `LlmScene` 一次性定义全部 7 个场景（含 M2 未落地的预留项），避免后续扩展改动枚举。
      JD 结构化解析与简历对比总结未列入枚举，使用全局默认，不参与场景级绑定。

    ## 实现状态标记
    M2 第一批与第二批（F3 / F6）已全部实现，后端 `ContractCoverageTest` 对「契约端点 = 实际控制器端点」做双向全等校验。
    后续里程碑新增路径可先用路径级 `x-implemented: false` 标记「已定义、待实现」，
    实现完成后删除标记即自动纳入双向全等校验，无需维护例外清单。
    M3 1.9.0 契约的全部端点已实现（1.9.3 真实面试轮次、1.9.4 复盘 / 分析 / 词表 / 改进动作、1.9.5 ASR 重试），
    1.10.0 新增跨场洞察端点，1.20.0 新增 token 成本统计，1.21.0 新增复盘音频清理，1.22.0 新增提示词工作台；
    当前 101 个已实现端点纳入双向全等校验；1.23.0 的 5 个评测端点已实现并纳入同一校验。
    1.24.0 新增 4 个基线 / 对比端点，均已实现并纳入同一校验。

    ## 错误码补充（M2）
    - `40906` 公司名称已存在（`companies.name` UNIQUE）
    - `40905` 资源仍被引用，禁止删除（公司被岗位引用、简历 / 岗位被投递引用；先解除关联）
    - `40907` 简历分析未完成，无法参与对比（F7 依赖两份 COMPLETED 的分析结果）
    - `40908` JD 解析 / 匹配任务执行中，请等待完成
    - `40910` 简历分析任务执行中（FR1.5）
    - `40911` 面试任务执行中（出题 / 追问生成 / 评估），请等待完成
    - `40912` 面试会话已交卷或已评估，不可再操作
    - `40913` 当前面试会话状态不允许该操作
    - `40914` 保留组 Offer 已达上限（最多 4 个）

    ## 错误码补充（M3 1.9.0）
    - `40915` 复盘任务执行中（ASR / 分析），请等待完成
    - `40916` 复盘分析尚未完成，无法确认
    - `40917` 该投递的面试轮次已存在复盘记录

    ## 错误码补充（1.22.0）
    - `40920` 提示词版本并发冲突，请刷新后重试

    ## 错误码补充（1.23.0）
    - `40918` 已有评测任务执行中，请等待完成
    - `40919` 评测已结束，不可取消

  contact:
    name: 面后（AfterRound）
  license:
    name: 私有项目（未授权）
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:8080
    description: 本地开发环境

tags:
  - name: 模型配置
    description: Provider / Model 增删改查、连通测试、模型列举、全局默认、场景级绑定。配置存数据库，保存即生效。
  - name: 提示词
    description: 提示词查看、草稿、发布、回滚与版本历史；发布后热更新，不自动触发评测。
  - name: 评测运行
    description: 场景级评测语料的异步运行、进度、取消与逐用例结果；始终由用户主动触发，运行不等于基线。
  - name: 对话会话
    description: 会话内 Provider + Model 两级切换与流式对话；任务执行中禁止切换。
  - name: 简历
    description: 简历上传、解析、异步分析与报告查询。
  - name: 简历对比
    description: 手动选择两份已完成分析的简历，对比分数、优势短板与岗位方向，并由 LLM 总结改动得失（F7）。
  - name: 公司
    description: 公司最小 CRUD 与名称联想检索；为岗位库、Offer 决策与求职洞察提供统一公司数据（M2 不做模糊自动合并）。
  - name: 岗位库
    description: JD 导入与结构化解析、生命周期状态管理、简历-JD 匹配评分、行情洞察（F2）。
  - name: 模拟面试
    description: 结构化模拟面试：选方向或关联 JD、异步出题、逐题作答与追问、交卷后统一评估（F3）。
  - name: Offer 决策
    description: Offer 录入与 LLM 提取、保留 / 淘汰分组、同维度横向对比、前景与倾向分析（F6）。
  - name: 投递档案
    description: 简历版本 → 岗位 → 投递 → 面试 → 结果 → Offer 的档案与时间线（F8）。
  - name: 真实面试复盘
    description: 录音 / 转写 / 笔记 → 结构化问答、评分、标签、证据与改进行动（F4）。
  - name: 改进闭环
    description: 改进行动的状态与验证（F5）。
  - name: 复盘词表
    description: 知识点、失分类型与评分维度的受控词表，保证跨场可比。

security: []

paths:
  # ==========================================================
  # 模型配置 X1
  # ==========================================================

  /api/llm/providers:
    get:
      tags: [模型配置]
      operationId: listProviders
      summary: 查询 Provider 列表（含各自挂载的模型）
      description: 返回全部 Provider 及其模型，API Key 一律掩码显示。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProviderList'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [模型配置]
      operationId: createProvider
      summary: 新增 Provider
      description: 新建后立即可用，无需重启服务。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: providerKey 已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    get:
      tags: [模型配置]
      operationId: getProvider
      summary: 查询单个 Provider 详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProvider'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [模型配置]
      operationId: updateProvider
      summary: 更新 Provider
      description: |
        `apiKey` 传空或省略表示**保持原密钥不变**；传入新值则整体覆写密文。
        更新后相关的内存客户端缓存会被精确失效，下一次调用即使用新配置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模型配置]
      operationId: deleteProvider
      summary: 删除 Provider（级联删除其下所有模型）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该 Provider 正被进行中的会话或全局默认引用，不可删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}/test:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    post:
      tags: [模型配置]
      operationId: testProvider
      summary: 连通性测试
      description: |
        向上游发起一次最小调用，返回是否可用与耗时。
        **同时回显上游响应中的真实 `model` 字段**——用于识别网关的模型别名
        （不同配置名可能路由到同一后端）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestProviderRequest'
      responses:
        '200':
          description: 测试完成（无论连通与否均返回 200，结果看 success 字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultConnectivityTest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}/models:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
    get:
      tags: [模型配置]
      operationId: listUpstreamModels
      summary: 从上游拉取可用模型列表
      description: 调用上游 `/v1/models`；失败时回退为库内已登记的模型，并在 `source` 中标注来源。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUpstreamModelList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [模型配置]
      operationId: createModel
      summary: 在 Provider 下新增模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该 Provider 下已存在同名模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/providers/{providerKey}/models/{modelName}:
    parameters:
      - $ref: '#/components/parameters/ProviderKey'
      - $ref: '#/components/parameters/ModelName'
    put:
      tags: [模型配置]
      operationId: updateModel
      summary: 更新模型（改名请删除后重建）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultModel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模型配置]
      operationId: deleteModel
      summary: 删除模型
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该模型正被进行中的会话或全局默认引用，不可删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/global:
    get:
      tags: [模型配置]
      operationId: getGlobalSetting
      summary: 查询全局默认 Provider + Model
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultGlobalSetting'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [模型配置]
      operationId: updateGlobalSetting
      summary: 设置全局默认 Provider + Model
      description: 需校验该 Model 确实属于该 Provider，否则返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalSettingRequest'
      responses:
        '200':
          description: 设置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultGlobalSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/usage:
    get:
      tags: [模型配置]
      operationId: getLlmUsage
      summary: token 成本统计（NFR6）
      description: |
        - 聚合 `llm_call_logs`：总调用 / 成功率 / token / 平均耗时，并按场景、模型、按天分组。
        - 只读统计，不修改调用日志；无数据时各数组为空、比例为 null。
        - `days` 为统计窗口（默认 30 天，7~365）；模型维度按 token 降序最多返回 20 个。
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 30
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLlmUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 场景级模型绑定 FRX.11（M2）
  # ==========================================================

  /api/llm/scenes:
    get:
      tags: [模型配置]
      operationId: listSceneBindings
      summary: 查询全部场景的模型绑定与生效结果
      description: |
        返回 `LlmScene` 全部场景。未显式配置的场景 `inherited = true`，
        `effectiveProviderKey` / `effectiveModel` 取全局默认；全局默认也未配置时两者为 null。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSceneBindingList'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/scenes/{scene}:
    parameters:
      - $ref: '#/components/parameters/Scene'
    put:
      tags: [模型配置]
      operationId: bindSceneModel
      summary: 为场景指定 Provider + Model
      description: |
        - 目标 Provider 必须存在且启用，目标 Model 必须属于该 Provider 且启用，否则 **400**。
        - 保存即生效，后续该场景的调用按此绑定执行；`llm_call_logs` 仍记录实际使用的 Provider / Model。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindSceneModelRequest'
      responses:
        '200':
          description: 保存成功，返回该场景的最新绑定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSceneBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模型配置]
      operationId: unbindSceneModel
      summary: 清除场景绑定，回落全局默认
      description: 幂等：场景本就未配置时同样返回 200。
      responses:
        '200':
          description: 清除成功，返回回落后的生效配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSceneBinding'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 提示词工作台（1.22.0）
  # ==========================================================

  /api/llm/prompts:
    get:
      tags: [提示词]
      operationId: listPrompts
      summary: 查询全部提示词摘要
      description: 返回 12 组提示词的当前生效版本、草稿状态、占位符与影响功能；不返回全文。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPromptList'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/prompts/{promptKey}:
    parameters:
      - $ref: '#/components/parameters/PromptKey'
    get:
      tags: [提示词]
      operationId: getPrompt
      summary: 查询提示词详情
      description: |
        返回生效版本、代码内置默认、草稿与校验结果。
        `active.source=BUILTIN` 时 `versionNo=0`，前端显示「内置默认（vN）」。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPromptDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/prompts/{promptKey}/draft:
    parameters:
      - $ref: '#/components/parameters/PromptKey'
    put:
      tags: [提示词]
      operationId: savePromptDraft
      summary: 保存提示词草稿
      description: 保存草稿不影响线上；返回校验结果，草稿可保存但存在错误时不能发布。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePromptDraftRequest'
      responses:
        '200':
          description: 保存成功（含校验结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPromptDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 提示词版本并发冲突（业务码 40920），请刷新后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [提示词]
      operationId: discardPromptDraft
      summary: 丢弃提示词草稿
      description: 幂等：没有草稿时同样返回 200。
      responses:
        '200':
          description: 丢弃成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/prompts/{promptKey}/publish:
    parameters:
      - $ref: '#/components/parameters/PromptKey'
    post:
      tags: [提示词]
      operationId: publishPrompt
      summary: 发布提示词草稿
      description: 将草稿置为当前生效版本并热更新；发布不触发评测。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPromptRequest'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPromptDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 提示词版本并发冲突（业务码 40920），请刷新后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/prompts/{promptKey}/versions:
    parameters:
      - $ref: '#/components/parameters/PromptKey'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
    get:
      tags: [提示词]
      operationId: listPromptVersions
      summary: 提示词版本历史
      description: 只返回 ACTIVE / ARCHIVED；草稿在详情接口的 `draft` 字段，不混入历史列表。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPromptVersionPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/prompts/{promptKey}/versions/{versionNo}:
    parameters:
      - $ref: '#/components/parameters/PromptKey'
      - $ref: '#/components/parameters/PromptVersionNo'
    get:
      tags: [提示词]
      operationId: getPromptVersion
      summary: 提示词版本详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPromptVersionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/prompts/{promptKey}/versions/{versionNo}/activate:
    parameters:
      - $ref: '#/components/parameters/PromptKey'
      - $ref: '#/components/parameters/PromptVersionNo'
    post:
      tags: [提示词]
      operationId: activatePromptVersion
      summary: 回滚到历史版本
      description: 只允许激活 ARCHIVED 版本；已有草稿保留并返回 warning；不触发评测。
      responses:
        '200':
          description: 激活成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPromptDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 提示词版本并发冲突（业务码 40920），请刷新后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 评测运行（1.23.0）
  # ==========================================================

  /api/llm/eval/scenes:
    get:
      tags: [评测运行]
      operationId: listEvalScenes
      summary: 查询评测场景与重建原因
      description: |
        返回 3 个评测场景（简历分析 / JD 解析 / 复盘分析）的语料数量、当前提示词版本、
        生效模型、当前基线与重建原因。仅提示，不自动运行，也不阻塞使用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalSceneList'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/eval/runs:
    get:
      tags: [评测运行]
      operationId: listEvalRuns
      summary: 评测运行分页列表
      description: 默认按创建时间倒序；`errorCases` 只统计执行错误（ERROR），质量失败看用例 `status=FAIL`。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalRunPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [评测运行]
      operationId: createEvalRun
      summary: 创建异步评测运行
      description: |
        - 必须由用户主动触发；使用当前生效提示词与当前模型，启动时做快照，中途改配置不影响本次运行。
        - 同一时间只允许一个 PENDING / PROCESSING 运行，重复创建返回 **40918**。
        - 部分重跑（`sourceRunId + retryErrorsOnly`）要求源运行的语料指纹与当前一致；语料已变化返回 **400**，避免旧快照与新语料混用。
        - 评测调用写入 `llm_call_logs`，场景前缀 `EVAL_`；运行完成不等于基线。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvalRunRequest'
      responses:
        '200':
          description: 创建成功（异步执行，返回初始运行详情）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalRunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 已有评测任务执行中（业务码 40918），请等待完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/eval/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/EvalRunId'
    get:
      tags: [评测运行]
      operationId: getEvalRun
      summary: 评测运行详情与逐用例结果
      description: 返回运行摘要、逐用例断言明细，以及启动时的模型与提示词快照。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalRunDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/eval/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EvalRunId'
    post:
      tags: [评测运行]
      operationId: cancelEvalRun
      summary: 请求取消评测运行
      description: 置取消标记；当前用例结束后停止，剩余 PENDING 用例置 SKIPPED。已结束的运行返回 **40919**。
      responses:
        '200':
          description: 已受理取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalRunDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 评测已结束，不可取消（业务码 40919）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 基线对比（1.24.0）
  # ==========================================================

  /api/llm/eval/baselines:
    get:
      tags: [评测运行]
      operationId: listEvalBaselines
      summary: 按场景分页查询当前与历史基线
      description: 当前基线在前，其余按创建时间倒序；不传 `scene` 时返回全部场景。
      parameters:
        - name: scene
          in: query
          required: false
          schema:
            type: string
            enum: [resume-analysis, jd-parse, review-analyze]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalBaselinePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [评测运行]
      operationId: createEvalBaseline
      summary: 把已完成的运行设为基线（不重跑）
      description: |
        - 只接受 `COMPLETED` 且 `partial=false` 的运行；按场景分组，某场景存在 ERROR 用例时跳过并返回原因。
        - 运行时的语料指纹必须与当前语料一致；语料已变化返回 **400**，避免旧结果冒充当前基线。
        - 直接复用运行结果贴标签，不调用模型、不重跑；旧当前基线置为非当前，历史保留。
        - 同一 `(runId, scene)` 重复调用只更新 label / current，不重复插入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvalBaselineRequest'
      responses:
        '200':
          description: 逐场景处理结果（部分成功可区分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalBaselineResultList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/eval/baselines/{baselineId}/activate:
    parameters:
      - $ref: '#/components/parameters/BaselineId'
    post:
      tags: [评测运行]
      operationId: activateEvalBaseline
      summary: 将历史基线设为当前
      description: 只切换 `is_current` 标记，不重跑、不改历史；同场景其他基线自动取消当前。
      responses:
        '200':
          description: 设置成功，返回被激活的基线
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalBaselineSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/llm/eval/runs/compare:
    get:
      tags: [评测运行]
      operationId: compareEvalRuns
      summary: 两次运行 4 维对比
      description: |
        对比对象是 run vs run；基线只是被标记的 run。只有 `COMPLETED` 且 `partial=false` 的运行可参与完整对比。
        可比性要求场景、Provider、Model、参数、语料 hash、引擎版本一致；提示词是被测变量，不参与判定。
        不可比时仍返回 200，`comparable=false` 并在 `reasons` 中说明。
      parameters:
        - name: leftRunId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: rightRunId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功（含不可比分支）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEvalRunCompare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 对话会话（M1 能力验证载体）
  # ==========================================================

  /api/chat/sessions:
    get:
      tags: [对话会话]
      operationId: listChatSessions
      summary: 会话分页列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [对话会话]
      operationId: createChatSession
      summary: 创建会话
      description: 未指定 Provider / Model 时，采用全局默认设置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatSessionRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [对话会话]
      operationId: getChatSession
      summary: 会话详情（含当前绑定的 Provider / Model 与状态）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [对话会话]
      operationId: deleteChatSession
      summary: 删除会话（级联删除其消息）
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/sessions/{sessionId}/model:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    patch:
      tags: [对话会话]
      operationId: switchChatModel
      summary: 切换会话的 Provider / Model（两级）
      description: |
        切换只改会话绑定，不迁移历史消息。

        **守卫规则（服务端判定，前端置灰仅作体验优化）**
        - 会话存在执行中的任务（`status = PROCESSING`）→ **409**，业务码 `40901`
        - 会话已锁定（`status = LOCKED`）→ **409**，业务码 `40902`
        - 目标 Model 不属于目标 Provider → **400**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchModelRequest'
      responses:
        '200':
          description: 切换成功，返回更新后的会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 执行中或已锁定，禁止切换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/chat/sessions/{sessionId}/messages:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [对话会话]
      operationId: listChatMessages
      summary: 查询会话历史消息（按时间正序）
      description: 每条消息包含实际使用的 `llmProvider` / `llmModel`，用于追溯。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultChatMessageList'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [对话会话]
      operationId: sendChatMessage
      summary: 发送消息（SSE 流式返回）
      description: |
        以 `text/event-stream` 流式返回，事件载荷为 JSON，格式见 `ChatStreamEvent`。

        常见事件序列：
        1. 一个或多个 `delta`（增量文本）
        2. 结尾 `done`（含 messageId / providerKey / model / token 用量）
        3. 失败时 `error` 事件

        **并发守卫**：会话处于 `PROCESSING` 时再次发送返回 **409**（业务码 `40901`）；
        会话已 `LOCKED` 返回 **409**（业务码 `40902`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: 流式响应（每个 `data:` 行是一个 ChatStreamEvent 的 JSON）
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 执行中或已锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 简历 F1（轨一）
  # ==========================================================

  /api/resumes:
    get:
      tags: [简历]
      operationId: listResumes
      summary: 简历分页列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [简历]
      operationId: uploadResume
      summary: 上传简历（文件或粘贴文本）
      description: |
        - `file` 与 `text` 二选一，**不可同时为空**。
        - 支持 PDF / DOCX / DOC / TXT，单文件 ≤ 5MB。
        - 以内容 SHA-256 去重：重复上传直接返回已有记录，`duplicated = true`，不重复触发分析。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 简历文件（与 text 二选一）
                text:
                  type: string
                  description: 粘贴的简历纯文本（与 file 二选一）
      responses:
        '200':
          description: 上传成功或命中已有记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 文件超过 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '415':
          description: 不支持的文件类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    get:
      tags: [简历]
      operationId: getResume
      summary: 简历详情（含解析出的纯文本）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [简历]
      operationId: deleteResume
      summary: 删除简历
      description: 硬删除，级联删除分析结果与岗位匹配结果，同时清理磁盘上的原始文件；被投递记录引用时返回 **409**（40905），需先删除投递。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 简历已被投递记录引用（40905）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}/salary:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    put:
      tags: [简历]
      operationId: updateResumeSalary
      summary: 更新当前月薪与期望月薪
      description: |
        用户填写的值优先于 LLM 从简历提取的值，重新分析不会覆盖用户值。
        传入 null 表示清空对应用户值（回落为 LLM 提取值）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalaryRequest'
      responses:
        '200':
          description: 保存成功，返回合并后的最新分析状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeAnalysisStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}/analyze:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    post:
      tags: [简历]
      operationId: triggerResumeAnalysis
      summary: 触发或重试分析
      description: |
        异步任务，立即返回。前端随后轮询 `GET /api/resumes/{resumeId}/analysis`。

        - 当前已是 `PROCESSING` → **409**（业务码 `40910`）
        - 失败后重试会重置 `retryCount`
      responses:
        '200':
          description: 已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeAnalysisStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 分析进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/resumes/{resumeId}/analysis:
    parameters:
      - $ref: '#/components/parameters/ResumeId'
    get:
      tags: [简历]
      operationId: getResumeAnalysis
      summary: 查询分析状态与报告（轮询端点）
      description: |
        `status` 为 `PENDING` / `PROCESSING` 时 `report` 为 null；
        `COMPLETED` 时返回完整报告；`FAILED` 时返回 `error` 与 `retryCount`。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeAnalysisStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 简历版本对比 F7（M2 第一批）
  # ==========================================================

  /api/resume-comparisons:
    post:
      tags: [简历对比]
      operationId: compareResumes
      summary: 对比两份简历（同步返回）
      description: |
        手动选择两份**分析已完成（COMPLETED）**的简历发起对比，不落库、不产生历史记录（FR7.5）。

        - 分数、五维、优势短板、岗位方向的变化由本地计算，结果稳定可复现。
        - `summary.content` 由一次 LLM 调用生成；失败时降级为 `degraded = true`、`content = null`，
          本地对比结果照常返回（§6.5 / §9 分层降级）。
        - 两次分析使用的模型或 Prompt 版本不同时，`summary.modelMismatch` / `summary.promptVersionMismatch` 置为 true，
          前端须标注「模型或 Prompt 版本不同，仅供参考」（FR7.4）。
        - `promptVersion` 为 null 表示该次分析未记录版本；与有值的一方比较时按不同处理（保守标注）。
        - `summary` 的 LLM 调用走全局默认（简历对比不属于 `LlmScene` 枚举），不参与场景级绑定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResumeComparisonRequest'
      responses:
        '200':
          description: 对比成功（含降级结果）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResumeComparison'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任一份简历分析未完成，无法对比（业务码 40907）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 公司最小 CRUD（M2，F5 / F6 数据前置）
  # ==========================================================

  /api/companies:
    get:
      tags: [公司]
      operationId: listCompanies
      summary: 公司分页列表 / 名称联想检索
      description: |
        `keyword` 对 `name` 做包含匹配，用于录入时的公司联想（FR5.3）。
        **仅返回候选供用户确认，禁止据此自动合并**。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          required: false
          description: 公司名包含匹配的关键词
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompanyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [公司]
      operationId: createCompany
      summary: 新增公司
      description: |
        `name` 全等查重（UNIQUE），已存在返回 **409**、业务码 `40906`。
        M2 不做模糊自动合并，重复名称需用户自行改名规避。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 公司名称已存在（业务码 40906）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/companies/merge:
    post:
      tags: [公司]
      operationId: mergeCompanies
      summary: 手动合并公司（FR5.3 事后补救）
      description: |
        把源公司名下的岗位与 Offer 归并到目标公司，然后硬删除源公司。
        仅接受用户显式确认后的合并，不做自动合并；源与目标相同返回 **400**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeCompaniesRequest'
      responses:
        '200':
          description: 合并成功，返回合并后的目标公司
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    put:
      tags: [公司]
      operationId: updateCompany
      summary: 更新公司信息
      description: 改名时同样做全等查重，冲突返回 **409**、业务码 `40906`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCompany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 公司名称已存在（业务码 40906）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [公司]
      operationId: deleteCompany
      summary: 删除公司
      description: |
        硬删除。仍被岗位引用时返回 **409**、业务码 `40905`，需先解除岗位关联
        （M3 提供「合并公司」作为补救路径）。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 仍被岗位引用（业务码 40905）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 岗位库 F2（M2 第一批）
  # ==========================================================

  /api/job-positions:
    get:
      tags: [岗位库]
      operationId: listJobPositions
      summary: 岗位分页列表
      description: 按创建时间倒序；`parseStatus != COMPLETED` 的记录字段可能为空，前端按解析中展示。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          description: 按生命周期状态筛选
          schema:
            $ref: '#/components/schemas/JobPositionStatus'
        - name: city
          in: query
          required: false
          description: 城市精确匹配
          schema:
            type: string
            maxLength: 64
        - name: keyword
          in: query
          required: false
          description: 岗位名或公司名包含匹配
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPositionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [岗位库]
      operationId: importJobPosition
      summary: 导入 JD（文件 / 文本 / 截图），并触发异步结构化解析
      description: |
        - `file`、`text`、`images` 三选一，**不可同时为空**。
        - 文件支持 PDF / DOCX / DOC / TXT，≤ 5MB；截图支持 PNG / JPEG / WebP，最多 5 张，单张 ≤5MB。
        - 截图先走视觉模型提取 JD 原文，再进入结构化解析；原图不落库，只保存提取文本，`sourceType = IMAGE`。
        - 当前模型不支持图片时返回 400，并提示改用文本粘贴。
        - 创建后立即返回，`parseStatus = PENDING`；前端轮询 `GET /api/job-positions/{jobPositionId}` 直到 `COMPLETED` / `FAILED`。
        - 解析调用走全局默认（JD 解析不属于 `LlmScene` 枚举），不参与场景级绑定。
        - 解析出公司名后：与已有公司**全等同名**才自动关联，否则新建公司记录；不做模糊自动合并。
          需要改用其它公司时调用 `PUT /api/job-positions/{jobPositionId}` 指定 `companyId`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: JD 文件（与 text / images 三选一）
                text:
                  type: string
                  description: 粘贴的 JD 纯文本（与 file / images 三选一）
                images:
                  type: array
                  maxItems: 5
                  description: JD 截图（与 file / text 三选一）；仅 PNG / JPEG / WebP，单张 ≤5MB
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: 导入成功，解析进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 文件超过 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '415':
          description: 不支持的文件类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-positions/batch-delete:
    post:
      tags: [岗位库]
      operationId: batchDeleteJobPositions
      summary: 批量删除岗位
      description: 硬删除，同时级联删除岗位匹配结果；行情洞察按剩余 JD 实时重算（FR2.6）。任一岗位被投递记录引用时整批返回 **409**（40905），不做部分删除。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteJobPositionsRequest'
      responses:
        '200':
          description: 删除成功（部分 id 不存在时忽略）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-positions/{jobPositionId}:
    parameters:
      - $ref: '#/components/parameters/JobPositionId'
    get:
      tags: [岗位库]
      operationId: getJobPosition
      summary: 岗位详情（含解析原文与结构化字段，轮询端点）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPositionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [岗位库]
      operationId: updateJobPosition
      summary: 更新岗位信息 / 生命周期状态 / 修正解析结果
      description: |
        全部字段可选，仅传入的字段被更新。
        - `status` 走 SAVED → APPLIED → INTERVIEWING → CLOSED 生命周期，可任意方向调整。
        - 结构化字段为用户修正入口，覆盖 LLM 解析值；`parseStatus` 不受影响。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobPositionRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPosition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [岗位库]
      operationId: deleteJobPosition
      summary: 删除岗位
      description: 硬删除，级联删除该岗位的匹配结果；行情洞察按剩余 JD 实时重算（FR2.6）。被投递记录引用时返回 **409**（40905）。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 岗位已被投递记录引用（40905）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-positions/{jobPositionId}/parse:
    parameters:
      - $ref: '#/components/parameters/JobPositionId'
    post:
      tags: [岗位库]
      operationId: retryJobPositionParse
      summary: 触发或重试结构化解析
      description: |
        异步任务，立即返回。手动重试会重置 `retryCount`；解析成功后覆盖结构化字段。
        解析中（`PROCESSING`）重复调用返回 **409**。
      responses:
        '200':
          description: 已触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobPosition'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 解析进行中（业务码 40908）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-matches:
    get:
      tags: [岗位库]
      operationId: listJobMatches
      summary: 匹配结果分页列表
      description: 按创建时间倒序；`resumeId` 与 `jobPositionId` 可同时使用（取交集）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: resumeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: jobPositionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMatchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [岗位库]
      operationId: createJobMatch
      summary: 发起简历-JD 匹配评分（异步）
      description: |
        `(resumeId, jobPositionId)` 唯一：同一组合重复发起表示**重跑**，覆盖原结果并重置 `retryCount`。
        创建后立即返回，前端轮询 `GET /api/job-matches/{matchId}`。
        权重：技能匹配 50% / 经验匹配 30% / 加分项覆盖 20%，在 prompt 中显式声明。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobMatchRequest'
      responses:
        '200':
          description: 已创建（或已重跑）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 简历或岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 已有匹配任务执行中（业务码 40908）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-matches/{matchId}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [岗位库]
      operationId: getJobMatch
      summary: 查询匹配状态与结果（轮询端点）
      description: |
        `status` 为 `PENDING` / `PROCESSING` 时 `detail` 为 null；
        `COMPLETED` 时返回完整结果；`FAILED` 时返回 `error` 与 `retryCount`。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMatch'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/job-market/insights:
    get:
      tags: [岗位库]
      operationId: getJobMarketInsights
      summary: 行情洞察（实时统计）
      description: |
        基于**解析完成（COMPLETED）**的 JD 集合实时计算，不落快照表；JD 增删后结果立即变化（FR2.4 / FR2.6）。
        - 技能词频：必备与加分合并计数，归一化为小写去重后统计。
        - 薪资分布：以 `(salaryMin + salaryMax) / 2` 分桶，缺失薪资的 JD 不参与该维度。
        - 经验要求分布与岗位方向分布：按解析原文统计，**暂不做归一化**（同一含义的不同写法会分别计数）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultJobMarketInsights'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # 模拟面试 F3（M2 第二批，待实现）
  # ==========================================================

  /api/interview/directions:
    get:
      tags: [模拟面试]
      operationId: listInterviewDirections
      summary: 查询可选面试方向
      description: |
        方向由 `skill.meta.yml` 定义，新增方向只改技能配置，不改契约枚举。
        返回 direction 的 `key` 供创建会话时使用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewDirectionList'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions:
    get:
      tags: [模拟面试]
      operationId: listInterviewSessions
      summary: 模拟面试分页列表
      description: 按创建时间倒序；用于筛选与「继续未完成面试」（FR3.8）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: direction
          in: query
          required: false
          description: 按面试方向 key 筛选
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: 按会话状态筛选
          schema:
            $ref: '#/components/schemas/InterviewSessionStatus'
        - name: createdFrom
          in: query
          required: false
          description: 创建时间下限（含）
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          required: false
          description: 创建时间上限（含）
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [模拟面试]
      operationId: createInterviewSession
      summary: 创建模拟面试并异步生成题目
      description: |
        - `direction` 与 `jobPositionId` **至少填一个**；仅关联 JD 时，按 JD 内容选择最接近的方向出题。
        - 关联 `resumeId` 时简历题约 60%、方向题约 40%；未关联简历时全部为方向题（FR3.2）。
        - 创建后立即返回，`status = PREPARING`；前端轮询 `GET /api/interview-sessions/{sessionId}`
          直到 `IN_PROGRESS` / `FAILED`。
        - 出题场景为 `INTERVIEW_QUESTION`；未显式指定 `providerKey` / `model` 时按场景绑定取值，
          场景未绑定则回落全局默认。
        - 出题时注入同方向历史会话的 `topicSummary` 避免重复考察（FR3.3）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterviewSessionRequest'
      responses:
        '200':
          description: 创建成功，题目生成中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 关联的简历 / 岗位不存在，或面试方向 key 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    get:
      tags: [模拟面试]
      operationId: getInterviewSession
      summary: 面试会话详情（含题目与作答状态，轮询端点）
      description: |
        `status` 为 `PREPARING` / `GENERATING` 时 `questions` 可能不完整；
        `IN_PROGRESS` 时可作答；`SUBMITTED` / `COMPLETED` 为锁定状态，禁止作答与切换模型。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSessionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [模拟面试]
      operationId: deleteInterviewSession
      summary: 删除面试会话
      description: 硬删除，级联删除题目与评估结果（FR3.9）；进行中的异步任务检测到记录删除后终止。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/model:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    patch:
      tags: [模拟面试]
      operationId: switchInterviewSessionModel
      summary: 切换面试会话模型（Provider + Model 两级）
      description: |
        仅 `IN_PROGRESS` / `FAILED` 状态允许切换。
        `PREPARING` / `GENERATING` / `SUBMITTED`（任务执行中）返回 **409 / 40901**；
        `COMPLETED`（终态）返回 **409 / 40902**。
        切换只影响后续出题 / 追问 / 评估，不迁移已有题目（FR3.7 / FRX.5 / FRX.6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchModelRequest'
      responses:
        '200':
          description: 切换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务执行中（40901）或会话已锁定（40902）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/questions/retry:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    post:
      tags: [模拟面试]
      operationId: retryInterviewQuestions
      summary: 重新生成题目（出题失败后重试）
      description: |
        仅 `FAILED` 状态可调用；重置 `retryCount` 并重新异步出题（自动重试仍 ≤ 3 次）。
        其他状态返回 **409 / 40913**。
      responses:
        '200':
          description: 已重新触发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前状态不允许重试（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/questions/{questionIndex}/answer:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
      - $ref: '#/components/parameters/QuestionIndex'
    post:
      tags: [模拟面试]
      operationId: answerInterviewQuestion
      summary: 提交单题作答
      description: |
        - 仅 `IN_PROGRESS` 且该题 `answerStatus = UNANSWERED` 时可作答。
          任务执行中（`PREPARING` / `GENERATING` / `SUBMITTED`）返回 **409 / 40911**；
          已评估终态返回 **409 / 40912**；题目已作答 / 已跳过返回 **409 / 40913**。
        - 主问题作答后按 `followUpCount` 异步生成追问，会话短暂进入 `GENERATING`；前端轮询会话详情。
        - 同一主问题链的追问串行进行，链上题目全部作答 / 跳过后才进入下一主问题（FR3.4）。
        - 交卷后答案不可修改（FR3.6）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInterviewQuestionRequest'
      responses:
        '200':
          description: 作答已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewQuestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 会话或题目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 当前状态不允许作答（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/questions/{questionIndex}/skip:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
      - $ref: '#/components/parameters/QuestionIndex'
    post:
      tags: [模拟面试]
      operationId: skipInterviewQuestion
      summary: 跳过题目
      description: |
        - 跳过主问题时不再生成其追问链；跳过追问时按配置继续下一追问或下一主问题。
        - 跳过题计 0 分并标注「未作答」，不生成逐题点评（FR3.5）。
        - 任务执行中（`PREPARING` / `GENERATING` / `SUBMITTED`）返回 **409 / 40911**；
          已评估终态返回 **409 / 40912**；题目已作答 / 已跳过返回 **409 / 40913**。
      responses:
        '200':
          description: 已跳过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewQuestion'
        '404':
          description: 会话或题目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 当前状态不允许跳过（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/submit:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    post:
      tags: [模拟面试]
      operationId: submitInterviewSession
      summary: 交卷并异步生成评估报告
      description: |
        - 仅 `IN_PROGRESS` 且至少存在一道题目时可交卷；未作答题目按 FR3.5 记 0 分。
        - 交卷后会话锁定为 `SUBMITTED`，答案不可修改；评估完成后 `status = COMPLETED`（FR3.6 / FRX.6）。
        - 评估场景为 `INTERVIEW_EVALUATE`；失败原因通过评估接口的 `error` 查看。
        - 出题 / 追问 / 评估执行中返回 **409 / 40911**；已交卷或已评估返回 **409 / 40912**；
          无题目等非法状态返回 **409 / 40913**。
      responses:
        '200':
          description: 已交卷，评估进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 任务执行中（40911）或当前状态不允许交卷（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/interview-sessions/{sessionId}/evaluation:
    parameters:
      - $ref: '#/components/parameters/InterviewSessionId'
    get:
      tags: [模拟面试]
      operationId: getInterviewEvaluation
      summary: 查询评估状态与报告（轮询端点）
      description: |
        `status` 为 `PENDING` / `PROCESSING` 时报告字段为空；`COMPLETED` 返回完整报告；
        `FAILED` 返回 `error` 与 `retryCount`。逐题得分与点评在会话详情的 `questions` 中返回。
        会话未交卷时返回 **409 / 40913**。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInterviewEvaluation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未交卷，尚无评估（40913）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  # ==========================================================
  # Offer 决策 F6（M2 第二批，待实现）
  # ==========================================================

  /api/offers:
    get:
      tags: [Offer 决策]
      operationId: listOffers
      summary: Offer 分页列表
      description: 按创建时间倒序；可按保留组 / 淘汰组筛选（FR6.2）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: group
          in: query
          required: false
          description: 按分组筛选
          schema:
            $ref: '#/components/schemas/OfferGroup'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [Offer 决策]
      operationId: createOffer
      summary: 新增 Offer
      description: |
        - `companyId` 与 `jobPositionId` **至少填一个**；仅填岗位时自动带出所属公司（FR6.6）。
        - 默认进入保留组；保留组最多 4 个，超出返回 **409 / 40914**。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: 关联的公司或岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 保留组已达上限（40914）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/extract:
    post:
      tags: [Offer 决策]
      operationId: extractOffer
      summary: 从文本或图片提取 Offer 字段（不落库）
      description: |
        - `text` 与 `image` 二选一，不可同时为空；图片支持 PNG / JPEG / WEBP，≤ 5MB。
        - 解析结果供用户修正后调用创建 / 更新接口，本次**不落库**（FR6.1）。
        - 图片提取要求当前模型支持图片输入；不支持时返回 400 并引导改用文本粘贴。
        - 提取使用全局默认模型（不在 `LlmScene` 枚举内）；正式的 Offer 前景分析走 `OFFER_ANALYZE` 场景。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: 粘贴的 Offer 文本（与 image 二选一）
                image:
                  type: string
                  format: binary
                  description: Offer 截图（与 text 二选一）
      responses:
        '200':
          description: 提取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferExtraction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: 图片超过 5MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '415':
          description: 不支持的图片类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/comparison:
    get:
      tags: [Offer 决策]
      operationId: getOfferComparison
      summary: 保留组 Offer 同维度对比
      description: |
        返回保留组全部 Offer（最多 4 个）按**固定维度与固定顺序**排列的对比矩阵（FR6.3）：
        - 同一行永远对应同一字段，禁止跨字段错位；
        - 缺失值统一为字符串「未填写」；
        - 保留组为空时 `columns` 与 `rows` 均为空数组。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferComparison'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/{offerId}:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    get:
      tags: [Offer 决策]
      operationId: getOffer
      summary: Offer 详情
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [Offer 决策]
      operationId: updateOffer
      summary: 更新 Offer（含保留 / 淘汰分组调整）
      description: |
        全部字段可选：不传表示不修改，传 `null` 表示清空。
        移动到保留组时若除当前 Offer 外已有 4 个保留 Offer，返回 **409 / 40914**；可在保留组 / 淘汰组之间随时移动、反悔（FR6.2）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Offer 或关联的公司 / 岗位不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 保留组已达上限（40914）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [Offer 决策]
      operationId: deleteOffer
      summary: 删除 Offer
      description: 硬删除。
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/offers/{offerId}/analyze:
    parameters:
      - $ref: '#/components/parameters/OfferId'
    post:
      tags: [Offer 决策]
      operationId: analyzeOffer
      summary: 生成前景与决策倾向分析（同步）
      description: |
        基于关联公司 / 岗位资料与用户填写字段生成分析（FR6.4 / FR6.5）：
        - 默认 `webSearch = false`，结果标注「基于所给资料」；
        - 开启联网搜索需当前 Provider 支持，返回 `sources` 标注来源；
        - 使用场景 `OFFER_ANALYZE`；分析结果覆盖并持久化到该 Offer，详情接口返回最近一次结果。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeOfferRequest'
      responses:
        '200':
          description: 分析完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultOfferAnalysis'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

