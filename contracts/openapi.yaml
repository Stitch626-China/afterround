  /api/insights:
    get:
      tags: [跨场洞察]
      operationId: getInsights
      summary: 跨场归因与改进闭环统计（FR5.5 ~ FR5.9 / FR8.4）
      description: |
        - 只聚合已确认的复盘分析（`review_sessions.confirmed = true`），保证跨场可比；未确认的分析不计入。
        - `days` 为统计窗口（默认 90 天）；可按公司 / 岗位缩小范围。趋势对比为当前窗口与紧邻的前一个等长窗口。
        - 样本量 N < 5 时仍返回原始统计，但 `sample.sufficient = false`，前端只提示「样本不足」，不输出因果结论。
        - 纯本地聚合，不调用 LLM、不引入 RAG；所有比例在分母为 0 时返回 null。
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 90
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: jobPositionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInsightsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/insights/interview-events:
    get:
      tags: [跨场洞察]
      operationId: listInsightInterviewEvents
      summary: 面试明细（FR5.2 三层聚合浏览与扁平筛选）
      description: |
        按面试时间倒序返回事件明细，前端据此按「公司 → 岗位 → 轮次」分组钻取；
        同时支持按结果 / 轮次类型 / 知识点标签扁平筛选。
        知识点标签取自该轮次最近一次复盘分析；未复盘时为 null。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: days
          in: query
          required: false
          description: 统计窗口（天），按面试时间过滤
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 90
        - name: companyId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: jobPositionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: result
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InterviewResult'
        - name: roundType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InterviewRoundType'
        - name: topic
          in: query
          required: false
          description: 知识点标签 key（来自复盘词表）
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInsightEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/insights/summary:
    post:
      tags: [跨场洞察]
      operationId: summarizeInsights
      summary: AI 总结（FR5.8 可选）
      description: |
        - 基于同一时间窗口的结构化聚合结果调用一次模型生成洞察总结，不引入 RAG。
        - 模型解析优先 `REVIEW_ANALYZE` 场景绑定，未绑定时回落全局默认；调用落 `llm_call_logs`（scene=`INSIGHTS_SUMMARY`）。
        - 模型未配置或调用失败时 `degraded = true`，`content` 回退本地规则总结，接口不报错。
        - 已确认复盘为 0 时不调用模型，直接返回本地总结（`degraded = true`）；
          1~4 份会正常生成，但需标注样本不足、不输出因果结论。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightsSummaryRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultInsightsSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

components:

  parameters:
    ProviderKey:
      name: providerKey
      in: path
      required: true
      description: Provider 的内部唯一标识（如 `corp-gateway`）
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
        example: corp-gateway
    PromptKey:
      name: promptKey
      in: path
      required: true
      description: 提示词分组 key（如 resume-analysis）
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
        example: resume-analysis
    PromptVersionNo:
      name: versionNo
      in: path
      required: true
      description: 提示词 DB 版本号（从 1 开始；内置默认不在此路径使用）
      schema:
        type: integer
        minimum: 1
        example: 1
    EvalRunId:
      name: runId
      in: path
      required: true
      description: 评测运行 ID
      schema:
        type: integer
        format: int64
    BaselineId:
      name: baselineId
      in: path
      required: true
      description: 基线 ID
      schema:
        type: integer
        format: int64
    ModelName:
      name: modelName
      in: path
      required: true
      description: 模型名（上游返回的 model id）
      schema:
        type: string
        example: Qwen3.8-27B
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    JobPositionId:
      name: jobPositionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    InterviewSessionId:
      name: sessionId
      in: path
      required: true
      description: 模拟面试会话 ID
      schema:
        type: integer
        format: int64
    QuestionIndex:
      name: questionIndex
      in: path
      required: true
      description: 会话内的题目序号（主问题与追问统一顺序，从 1 开始）
      schema:
        type: integer
        minimum: 1
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: 投递记录 ID
      schema:
        type: integer
        format: int64
    EventId:
      name: eventId
      in: path
      required: true
      description: 真实面试轮次 ID
      schema:
        type: integer
        format: int64
    ReviewSessionId:
      name: reviewSessionId
      in: path
      required: true
      description: 真实面试复盘记录 ID
      schema:
        type: integer
        format: int64
    ActionId:
      name: actionId
      in: path
      required: true
      description: 改进行动 ID
      schema:
        type: integer
        format: int64
    Scene:
      name: scene
      in: path
      required: true
      description: LLM 调用场景
      schema:
        $ref: '#/components/schemas/LlmScene'
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数，默认 20，最大 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 参数校验失败（业务码 40001）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    NotFound:
      description: 资源不存在（业务码 40401）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    ServerError:
      description: 服务内部错误（业务码 50000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'

  schemas:

    # ---------- 通用 ----------

    ResultVoid:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: integer
          description: 0 表示成功，非 0 为业务错误码
          example: 0
        message:
          type: string
          example: ok
        data:
          description: 成功时返回业务数据；失败时为空
        traceId:
          type: string
          example: 3f7a1c2e9b4d

    ResultProvider:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LlmProvider'

    ResultProviderList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/LlmProvider'

    ResultModel:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LlmModel'

    ResultConnectivityTest:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConnectivityTest'

    ResultUpstreamModelList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UpstreamModelList'

    ResultGlobalSetting:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GlobalSetting'

    ResultChatSession:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ChatSession'

    ResultChatSessionPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChatSession'

    ResultChatMessageList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'

    ResultResumeUpload:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeUpload'
    
    ResultResumeDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeDetail'

    ResultResumePage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ResumeListItem'

    ResultResumeAnalysisStatus:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeAnalysisStatus'

    PageResult:
      type: object
      required: [total, page, size]
      properties:
        total:
          type: integer
          format: int64
          example: 42
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20

    # ---------- 模型配置 ----------

    LlmProvider:
      type: object
      required: [providerKey, label, baseUrl, enabled, sortOrder]
      properties:
        providerKey:
          type: string
          example: corp-gateway
        label:
          type: string
          description: 展示名称
          example: 公司内网网关
        baseUrl:
          type: string
          format: uri
          description: OpenAI 兼容端点，需包含 /v1
          example: https://api.example.com/v1
        apiKeyMasked:
          type: string
          description: 掩码后的密钥，仅用于展示，**永不返回明文**
          example: sk-****MwMY
        enabled:
          type: boolean
        sortOrder:
          type: integer
          example: 10
        models:
          type: array
          items:
            $ref: '#/components/schemas/LlmModel'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LlmModel:
      type: object
      required: [modelName, label, enabled, isDefault, sortOrder]
      properties:
        modelName:
          type: string
          description: 上游模型名，请求时原样传给 /chat/completions
          example: Qwen3.8-27B
        label:
          type: string
          example: Qwen3.8 27B
        enabled:
          type: boolean
        isDefault:
          type: boolean
          description: 是否为该 Provider 下的默认模型
        sortOrder:
          type: integer
          example: 10
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateProviderRequest:
      type: object
      required: [providerKey, label, baseUrl, apiKey]
      properties:
        providerKey:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
          description: 内部唯一标识，创建后不可修改
          example: corp-gateway
        label:
          type: string
          maxLength: 64
          example: 公司内网网关
        baseUrl:
          type: string
          format: uri
          maxLength: 512
          example: https://api.example.com/v1
        apiKey:
          type: string
          description: 明文传入，服务端加密存储，绝不回显
          example: sk-xxxxxxxx
        enabled:
          type: boolean
          default: true
        sortOrder:
          type: integer
          default: 10

    UpdateProviderRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 64
        baseUrl:
          type: string
          format: uri
          maxLength: 512
        apiKey:
          type: string
          description: 省略或传空表示保持原密钥不变
        enabled:
          type: boolean
        sortOrder:
          type: integer

    CreateModelRequest:
      type: object
      required: [modelName, label]
      properties:
        modelName:
          type: string
          maxLength: 128
          example: Qwen3.8-27B
        label:
          type: string
          maxLength: 64
          example: Qwen3.8 27B
        enabled:
          type: boolean
          default: true
        isDefault:
          type: boolean
          default: false
        sortOrder:
          type: integer
          default: 10

    UpdateModelRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 64
        enabled:
          type: boolean
        isDefault:
          type: boolean
        sortOrder:
          type: integer

    TestProviderRequest:
      type: object
      properties:
        modelName:
          type: string
          description: 指定用于测试的模型；省略则使用该 Provider 的默认模型
          example: Qwen3.8-27B

    ConnectivityTest:
      type: object
      required: [success, latencyMs]
      properties:
        success:
          type: boolean
        latencyMs:
          type: integer
          format: int64
          example: 812
        message:
          type: string
          description: 失败时的原因摘要（不含密钥）
          example: HTTP 401 Unauthorized
        upstreamModel:
          type: string
          description: |
            上游响应中回显的**真实 model 字段**。
            与请求的 modelName 不一致说明网关存在模型别名（多个名字指向同一后端）。
          example: Qwen3.8-27B-W8A8-DFlash2

    UpstreamModelList:
      type: object
      required: [source, models]
      properties:
        source:
          type: string
          enum: [UPSTREAM, LOCAL_FALLBACK]
          description: UPSTREAM 表示实时拉取成功；LOCAL_FALLBACK 表示回退为库内登记列表
        models:
          type: array
          items:
            type: string
          example: [Qwen3.8-27B]

    GlobalSetting:
      type: object
      properties:
        defaultProviderKey:
          type: [string, "null"]
          example: corp-gateway
        defaultModel:
          type: [string, "null"]
          example: Qwen3.8-27B

    UpdateGlobalSettingRequest:
      type: object
      required: [defaultProviderKey, defaultModel]
      properties:
        defaultProviderKey:
          type: string
        defaultModel:
          type: string

    # ---------- 对话会话 ----------

    ChatSessionStatus:
      type: string
      description: |
        - `IDLE`：空闲，可发消息、可切换模型
        - `PROCESSING`：正在生成回答，**禁止切换**（409 / 40901）
        - `LOCKED`：终态锁定，**禁止切换与继续发消息**（409 / 40902）
      enum: [IDLE, PROCESSING, LOCKED]

    ChatSession:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          example: 新会话
        currentProviderKey:
          type: [string, "null"]
          example: corp-gateway
        currentModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        status:
          $ref: '#/components/schemas/ChatSessionStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateChatSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 128
          description: 省略时自动生成
        providerKey:
          type: string
          description: 省略则使用全局默认
        model:
          type: string
          description: 省略则使用全局默认

    SwitchModelRequest:
      type: object
      required: [providerKey, model]
      properties:
        providerKey:
          type: string
          example: corp-gateway
        model:
          type: string
          example: Qwen3.8-27B

    ChatRole:
      type: string
      enum: [USER, ASSISTANT]

    ChatMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/ChatRole'
        content:
          type: string
        llmProvider:
          type: [string, "null"]
          description: 实际使用的 Provider（仅 ASSISTANT 消息有值）
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          description: 实际使用的模型（仅 ASSISTANT 消息有值）
          example: Qwen3.8-27B
        traceId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time

    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 20000

    ChatStreamEvent:
      type: object
      description: 'SSE 事件载荷（每行 `data: {json}`）'
      required: [type]
      properties:
        type:
          type: string
          enum: [delta, done, error]
          description: |
            - `delta`：增量文本，读 `content`
            - `done`：本次回答结束，读 `messageId` / `providerKey` / `model` / `totalTokens`
            - `error`：出错，读 `code` / `message`
        content:
          type: string
          description: type = delta 时的增量文本
        messageId:
          type: integer
          format: int64
          description: type = done 时，落库的 assistant 消息 id
        providerKey:
          type: string
          description: type = done 时，实际使用的 Provider
        model:
          type: string
          description: type = done 时，实际使用的模型
        totalTokens:
          type: integer
          description: type = done 时，本次消耗的 token
        code:
          type: integer
          description: type = error 时的业务错误码
        message:
          type: string
          description: type = error 时的错误描述

    # ---------- 简历 ----------

    AnalyzeStatus:
      type: string
      description: 分析任务状态机
      enum: [PENDING, PROCESSING, COMPLETED, FAILED]

    ResumeListItem:
      type: object
      required: [id, analyzeStatus, createdAt]
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: [string, "null"]
          description: 粘贴文本导入时为 null
        fileType:
          type: [string, "null"]
          example: PDF
        fileSize:
          type: [integer, "null"]
          format: int64
          example: 204800
        analyzeStatus:
          $ref: '#/components/schemas/AnalyzeStatus'
        overallScore:
          type: [integer, "null"]
          description: 分析完成后的总分，未完成时为 null
          example: 78
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResumeUpload:
      type: object
      required: [resume, duplicated]
      properties:
        resume:
          $ref: '#/components/schemas/ResumeListItem'
        duplicated:
          type: boolean
          description: true 表示命中已有的相同内容（SHA-256 去重），未重复触发分析

    ResumeDetail:
      allOf:
        - $ref: '#/components/schemas/ResumeListItem'
        - type: object
          properties:
            fileHash:
              type: string
              description: 内容 SHA-256
            resumeText:
              type: string
              description: Tika 解析并清洗后的纯文本
            analyzeError:
              type: [string, "null"]
            retryCount:
              type: integer
              example: 0

    ResumeAnalysisStatus:
      type: object
      required: [resumeId, status, retryCount]
      properties:
        resumeId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AnalyzeStatus'
        error:
          type: [string, "null"]
          description: 失败原因（截断至 500 字）
        retryCount:
          type: integer
          description: 已自动重试次数，上限 3
          example: 0
        report:
          oneOf:
            - $ref: '#/components/schemas/ResumeAnalysisReport'
            - type: "null"
          description: 仅 status = COMPLETED 时有值

    ResumeAnalysisReport:
      type: object
      required: [overallScore, dimensions]
      properties:
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 五维加权总分
          example: 78
        dimensions:
          type: array
          description: 五维评分，权重合计 100
          items:
            $ref: '#/components/schemas/AnalysisDimension'
        basicInfo:
          $ref: '#/components/schemas/ResumeBasicInfo'
        strengths:
          type: array
          description: 优势清单，带简历原句引用
          items:
            $ref: '#/components/schemas/QuoteItem'
        weaknesses:
          type: array
          description: 短板清单，带简历原句引用
          items:
            $ref: '#/components/schemas/QuoteItem'
        suggestions:
          type: array
          description: 逐条优化建议（原句 vs 优化句）
          items:
            $ref: '#/components/schemas/SuggestionItem'
        careerDirections:
          type: array
          description: 岗位方向推荐（轨一，3-5 个）
          items:
            $ref: '#/components/schemas/CareerDirection'
        llmProvider:
          type: string
          example: corp-gateway
        llmModel:
          type: string
          example: Qwen3.8-27B

    AnalysisDimension:
      type: object
      required: [key, label, score, weight]
      properties:
        key:
          type: string
          enum: [technicalDepth, projectQuality, engineeringAbility, expressionStructure, jobMatchPotential]
        label:
          type: string
          example: 技术深度
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 82
        weight:
          type: integer
          description: 权重百分比，五维合计 100
          enum: [30, 25, 20, 15, 10]

    ResumeBasicInfo:
      type: object
      properties:
        name:
          type: [string, "null"]
          example: 张三
        yearsOfExperience:
          type: [number, "null"]
          description: 工作年限（年）
          example: 7
        techDirection:
          type: [string, "null"]
          example: Java 后端
        currentMonthlySalary:
          type: [integer, "null"]
          description: 当前月薪（元/月）；用户填写值优先于 LLM 提取值
          example: 18000
        expectedMonthlySalary:
          type: [integer, "null"]
          description: 期望月薪（元/月）
          example: 25000

    UpdateSalaryRequest:
      type: object
      properties:
        currentMonthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: 当前月薪（元/月）；null 表示清空用户值
          example: 18000
        expectedMonthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: 期望月薪（元/月）；null 表示清空用户值
          example: 25000

    QuoteItem:
      type: object
      required: [quote, comment]
      properties:
        quote:
          type: string
          description: 简历原句
          example: 负责订单系统重构
        comment:
          type: string
          description: 说明
          example: 未量化结果，缺少可验证的影响数据

    SuggestionItem:
      type: object
      required: [original, improved]
      properties:
        original:
          type: string
          description: 简历原句
        improved:
          type: string
          description: 优化后的写法
        reason:
          type: string
          description: 这样改的理由

    CareerDirection:
      type: object
      required: [direction, matchReason]
      properties:
        direction:
          type: string
          example: Java 后端开发
        matchReason:
          type: string
          description: 为什么适合
        skillGaps:
          type: array
          description: 该方向上的技能差距
          items:
            type: string
        interviewFocus:
          type: array
          description: 面试准备重点（高频考点）
          items:
            type: string

    # ---------- 场景级模型绑定（M2 第一批） ----------

    LlmScene:
      type: string
      description: |
        LLM 调用场景（FRX.11）。枚举一次性定义全部 7 个场景；
        M2 第一批实际生效的是 `JOB_MATCH`，其余为 M2 第二批 / M3 预留。
        JD 结构化解析与简历对比总结不在枚举内，使用全局默认，不参与场景级绑定。
      enum:
        - RESUME_ANALYZE
        - CHAT
        - JOB_MATCH
        - INTERVIEW_QUESTION
        - INTERVIEW_EVALUATE
        - OFFER_ANALYZE
        - REVIEW_ANALYZE

    SceneBinding:
      type: object
      required: [scene, label, inherited]
      properties:
        scene:
          $ref: '#/components/schemas/LlmScene'
        label:
          type: string
          description: 场景的中文展示名
          example: 简历分析
        providerKey:
          type: [string, "null"]
          description: 显式绑定的 Provider；null 表示未配置
          example: corp-gateway
        model:
          type: [string, "null"]
          description: 显式绑定的模型；null 表示未配置
          example: Qwen3.8-27B
        inherited:
          type: boolean
          description: true 表示未显式配置，实际生效值来自全局默认
        effectiveProviderKey:
          type: [string, "null"]
          description: 实际生效的 Provider（未配置时为全局默认；全局默认也未配置则为 null）
          example: corp-gateway
        effectiveModel:
          type: [string, "null"]
          description: 实际生效的模型
          example: Qwen3.8-27B
        updatedAt:
          type: [string, "null"]
          format: date-time
          description: 显式配置的最后更新时间；未配置时为 null

    BindSceneModelRequest:
      type: object
      required: [providerKey, model]
      properties:
        providerKey:
          type: string
          example: corp-gateway
        model:
          type: string
          example: Qwen3.8-27B

    ResultSceneBinding:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SceneBinding'

    ResultSceneBindingList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SceneBinding'

    # ---------- 公司（M2 第一批） ----------

    Company:
      type: object
      required: [id, name, jobPositionCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 公司名称，全局唯一
          example: 字节跳动
        intro:
          type: [string, "null"]
          description: 公司介绍文本（用于 Offer 前景分析与复盘上下文）
        tags:
          type: array
          description: 公司标签
          items:
            type: string
        jobPositionCount:
          type: integer
          description: 关联的岗位数量；大于 0 时禁止删除
          example: 3
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          example: 字节跳动
        intro:
          type: [string, "null"]
          maxLength: 10000
        tags:
          type: array
          items:
            type: string
            maxLength: 32

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        intro:
          type: [string, "null"]
          maxLength: 10000
        tags:
          type: array
          items:
            type: string
            maxLength: 32

    MergeCompaniesRequest:
      type: object
      required: [sourceCompanyId, targetCompanyId]
      properties:
        sourceCompanyId:
          type: integer
          format: int64
          description: 被合并的源公司；合并后删除
        targetCompanyId:
          type: integer
          format: int64
          description: 保留的目标公司

    ResultCompany:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Company'

    ResultCompanyPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Company'

    # ---------- 岗位库 F2（M2 第一批） ----------

    JobPositionStatus:
      type: string
      description: 岗位生命周期状态，可任意方向调整；OFFERED 录用 / REJECTED 淘汰为两种终态结果
      enum: [SAVED, APPLIED, INTERVIEWING, OFFERED, REJECTED]

    JobPositionListItem:
      type: object
      required: [id, sourceType, status, parseStatus, retryCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        sourceType:
          type: string
          enum: [TEXT, FILE, IMAGE, MANUAL]
          description: 导入来源（IMAGE = 截图视觉识别，原图不落库；MANUAL = 复盘快速录入，无 JD 原文）
        title:
          type: [string, "null"]
          description: 岗位名；解析完成前可能为 null
          example: Java 后端开发工程师
        companyId:
          type: [integer, "null"]
          format: int64
        companyName:
          type: [string, "null"]
          example: 字节跳动
        city:
          type: [string, "null"]
          example: 上海
        salaryMin:
          type: [integer, "null"]
          description: 薪资下限（元/月）
          example: 20000
        salaryMax:
          type: [integer, "null"]
          description: 薪资上限（元/月）
          example: 35000
        experience:
          type: [string, "null"]
          description: 经验要求原文（不做归一化）
          example: 3-5 年
        education:
          type: [string, "null"]
          description: 学历要求原文
          example: 本科及以上
        status:
          $ref: '#/components/schemas/JobPositionStatus'
        remark:
          type: [string, "null"]
          maxLength: 200
          description: 用户备注（如一面 / 二面、简历淘汰 / 面试淘汰）
          example: 二面已约
        parseStatus:
          $ref: '#/components/schemas/AnalyzeStatus'
        retryCount:
          type: integer
          description: 解析已自动重试次数，上限 3
          example: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobPositionDetail:
      allOf:
        - $ref: '#/components/schemas/JobPositionListItem'
        - type: object
          properties:
            fileName:
              type: [string, "null"]
              description: 文本 / 截图导入时为 null
            rawText:
              type: string
              description: JD 原文（文件导入时为解析清洗后的文本）
            mustHaveSkills:
              type: array
              description: 必备技能
              items:
                type: string
            niceToHaveSkills:
              type: array
              description: 加分技能
              items:
                type: string
            responsibility:
              type: [string, "null"]
              description: 职责摘要
            parseError:
              type: [string, "null"]
              description: 解析失败原因（截断至 500 字）
            llmProvider:
              type: [string, "null"]
              example: corp-gateway
            llmModel:
              type: [string, "null"]
              example: Qwen3.8-27B

    UpdateJobPositionRequest:
      type: object
      properties:
        title:
          type: [string, "null"]
          maxLength: 128
        companyId:
          type: [integer, "null"]
          format: int64
          description: null 表示解除公司关联
        city:
          type: [string, "null"]
          maxLength: 64
        salaryMin:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
        salaryMax:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
        experience:
          type: [string, "null"]
          maxLength: 64
        education:
          type: [string, "null"]
          maxLength: 64
        mustHaveSkills:
          type: array
          items:
            type: string
            maxLength: 64
        niceToHaveSkills:
          type: array
          items:
            type: string
            maxLength: 64
        responsibility:
          type: [string, "null"]
          maxLength: 5000
        status:
          $ref: '#/components/schemas/JobPositionStatus'
        remark:
          type: [string, "null"]
          maxLength: 200
          description: 用户备注；传空字符串表示清空

    BatchDeleteJobPositionsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
            format: int64

    ResultJobPosition:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobPositionListItem'

    ResultJobPositionDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobPositionDetail'

    ResultJobPositionPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/JobPositionListItem'

    # ---------- 简历-JD 匹配（M2 第一批） ----------

    CreateJobMatchRequest:
      type: object
      required: [resumeId, jobPositionId]
      properties:
        resumeId:
          type: integer
          format: int64
        jobPositionId:
          type: integer
          format: int64

    MatchDimension:
      type: object
      required: [key, label, score, weight]
      properties:
        key:
          type: string
          enum: [skillMatch, experienceMatch, bonusCoverage]
          description: 技能匹配 / 经验匹配 / 加分项覆盖
        label:
          type: string
          example: 技能匹配
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 82
        weight:
          type: integer
          description: 权重百分比，三项合计 100
          enum: [50, 30, 20]

    JobMatchDetail:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          description: 分项评分，三项权重合计 100
          items:
            $ref: '#/components/schemas/MatchDimension'
        gaps:
          type: array
          description: 差距清单（简历未覆盖的必备项 / 弱项）
          items:
            type: string
        preparationAdvice:
          type: array
          description: 针对性准备建议
          items:
            type: string

    JobMatch:
      type: object
      required: [id, resumeId, jobPositionId, status, retryCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        resumeId:
          type: integer
          format: int64
        jobPositionId:
          type: integer
          format: int64
        jobPositionTitle:
          type: [string, "null"]
          description: 冗余展示字段，避免前端二次查询
          example: Java 后端开发工程师
        companyName:
          type: [string, "null"]
          example: 字节跳动
        status:
          $ref: '#/components/schemas/AnalyzeStatus'
        error:
          type: [string, "null"]
          description: 失败原因（截断至 500 字）
        retryCount:
          type: integer
          description: 已自动重试次数，上限 3
          example: 0
        overallScore:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: 总体匹配分（本地按权重计算），未完成时 null
          example: 76
        detail:
          oneOf:
            - $ref: '#/components/schemas/JobMatchDetail'
            - type: "null"
          description: 仅 status = COMPLETED 时有值
        llmProvider:
          type: [string, "null"]
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResultJobMatch:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobMatch'

    ResultJobMatchPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/JobMatch'

    # ---------- 行情洞察 F2（M2 第一批） ----------

    CountItem:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
          description: 分组名（薪资区间 / 经验要求原文 / 岗位方向原文）
          example: 20-30K
        count:
          type: integer
          example: 12

    SkillCountItem:
      type: object
      required: [skill, count]
      properties:
        skill:
          type: string
          description: 技能名（必填与加分合并，小写归一）
          example: redis
        count:
          type: integer
          example: 18

    JobMarketInsights:
      type: object
      required:
        [sampleSize, generatedAt, skillTop, salaryDistribution, experienceDistribution, directionDistribution]
      properties:
        sampleSize:
          type: integer
          description: 参与统计的 JD 数（仅解析完成的记录）
          example: 42
        generatedAt:
          type: string
          format: date-time
        skillTop:
          type: array
          description: 技能词频 Top 20
          items:
            $ref: '#/components/schemas/SkillCountItem'
        salaryDistribution:
          type: array
          description: 薪资分布（按 min/max 中位数分桶，单位元/月）
          items:
            $ref: '#/components/schemas/CountItem'
        experienceDistribution:
          type: array
          description: 经验要求分布（原文统计，不做归一化）
          items:
            $ref: '#/components/schemas/CountItem'
        directionDistribution:
          type: array
          description: 岗位方向分布（岗位名原文 Top 20，不做归一化）
          items:
            $ref: '#/components/schemas/CountItem'

    ResultJobMarketInsights:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/JobMarketInsights'

    # ---------- 简历版本对比 F7（M2 第一批） ----------

    CreateResumeComparisonRequest:
      type: object
      required: [baseResumeId, targetResumeId]
      properties:
        baseResumeId:
          type: integer
          format: int64
          description: 基准简历（较早版本）
        targetResumeId:
          type: integer
          format: int64
          description: 对比简历（较新版本），不得与 baseResumeId 相同

    ComparisonSide:
      type: object
      required: [resumeId, overallScore, analyzedAt]
      properties:
        resumeId:
          type: integer
          format: int64
        fileName:
          type: [string, "null"]
          description: 粘贴文本导入时为 null
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
        analyzedAt:
          type: string
          format: date-time
          description: 该份简历分析完成时间
        llmProvider:
          type: [string, "null"]
        llmModel:
          type: [string, "null"]
        promptVersion:
          type: [string, "null"]
          description: 该次分析使用的 Prompt 版本；M1 历史分析为 null（FR7.4）

    DimensionDelta:
      type: object
      required: [key, label, baseScore, targetScore, delta]
      properties:
        key:
          type: string
          enum: [technicalDepth, projectQuality, engineeringAbility, expressionStructure, jobMatchPotential]
        label:
          type: string
          example: 技术深度
        baseScore:
          type: integer
          minimum: 0
          maximum: 100
        targetScore:
          type: integer
          minimum: 0
          maximum: 100
        delta:
          type: integer
          description: targetScore - baseScore
          example: 6

    ComparisonSummary:
      type: object
      required: [content, modelMismatch, promptVersionMismatch, degraded]
      properties:
        content:
          type: [string, "null"]
          description: LLM 总结的改动优点与退步；降级时为 null
        modelMismatch:
          type: boolean
          description: 两份分析使用的模型不同，结果仅供参考（FR7.4）
        promptVersionMismatch:
          type: boolean
          description: 两份分析的 Prompt 版本不同（含一方未记录），结果仅供参考（FR7.4）
        degraded:
          type: boolean
          description: true 表示 LLM 总结失败，本地对比结果仍有效
        degradeReason:
          type: [string, "null"]
          description: 降级原因

    ResumeComparison:
      type: object
      required: [base, target, overallScoreDelta, dimensionDeltas, summary]
      properties:
        base:
          $ref: '#/components/schemas/ComparisonSide'
        target:
          $ref: '#/components/schemas/ComparisonSide'
        overallScoreDelta:
          type: integer
          description: target 总分 - base 总分
          example: 5
        dimensionDeltas:
          type: array
          description: 五维对比，固定顺序
          items:
            $ref: '#/components/schemas/DimensionDelta'
        strengthsAdded:
          type: array
          description: target 新增的优势（按 quote 文本比对）
          items:
            $ref: '#/components/schemas/QuoteItem'
        strengthsRemoved:
          type: array
          description: target 相比 base 不再具备的优势
          items:
            $ref: '#/components/schemas/QuoteItem'
        weaknessesAdded:
          type: array
          description: target 新增的短板
          items:
            $ref: '#/components/schemas/QuoteItem'
        weaknessesRemoved:
          type: array
          description: target 相比 base 已消除的短板
          items:
            $ref: '#/components/schemas/QuoteItem'
        directionsAdded:
          type: array
          description: target 新增的岗位方向
          items:
            type: string
        directionsRemoved:
          type: array
          description: target 不再推荐的岗位方向
          items:
            type: string
        summary:
          $ref: '#/components/schemas/ComparisonSummary'

    ResultResumeComparison:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ResumeComparison'

    # ---------- 模拟面试 F3（M2 第二批） ----------

    InterviewSessionStatus:
      type: string
      description: |
        - `PREPARING`：初次出题中（含自动重试）
        - `IN_PROGRESS`：题目就绪，可作答
        - `GENERATING`：追问生成中（作答主问题后短暂状态）
        - `SUBMITTED`：已交卷，评估中 / 待评估
        - `COMPLETED`：评估完成（终态，禁止作答与切换）
        - `FAILED`：出题失败，可重试
      enum: [PREPARING, IN_PROGRESS, GENERATING, SUBMITTED, COMPLETED, FAILED]

    InterviewDirection:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: 方向标识，创建会话时传入
          example: java-backend
        label:
          type: string
          example: Java 后端
        description:
          type: [string, "null"]
          description: 方向说明（考察范围等）

    InterviewQuestionType:
      type: string
      description: 主问题 / 追问
      enum: [MAIN, FOLLOW_UP]

    InterviewQuestionDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]

    InterviewAnswerStatus:
      type: string
      description: 未作答 / 已作答 / 已跳过
      enum: [UNANSWERED, ANSWERED, SKIPPED]

    InterviewQuestion:
      type: object
      required: [questionIndex, type, content, difficulty, answerStatus, keyPoints]
      properties:
        questionIndex:
          type: integer
          minimum: 1
          description: 会话内统一顺序号（主问题与追问按实际呈现顺序编号）
          example: 3
        parentIndex:
          type: [integer, "null"]
          description: 追问所属主问题的 questionIndex；主问题为 null
          example: 2
        type:
          $ref: '#/components/schemas/InterviewQuestionType'
        content:
          type: string
          description: 题目正文
        topicSummary:
          type: [string, "null"]
          description: 知识点摘要，用于历史去重与后续聚合（FR3.3）
          example: JVM 垃圾回收
        difficulty:
          $ref: '#/components/schemas/InterviewQuestionDifficulty'
        answerStatus:
          $ref: '#/components/schemas/InterviewAnswerStatus'
        answer:
          type: [string, "null"]
          description: 用户作答原文；未作答或跳过为 null
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: 评估完成后有值；跳过 / 未作答记 0 分
        feedback:
          type: [string, "null"]
          description: 逐题点评；跳过 / 未作答为 null
        referenceAnswer:
          type: [string, "null"]
          description: 参考答案；跳过 / 未作答为 null
        keyPoints:
          type: array
          description: 答题关键点
          items:
            type: string
        llmProvider:
          type: [string, "null"]
          description: 生成该题实际使用的 Provider
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B

    InterviewSession:
      type: object
      required: [id, status, evaluateStatus, questionCount, followUpCount, answeredCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        direction:
          type: [string, "null"]
          description: 面试方向 key；仅关联 JD 时仍会回填匹配到的方向
          example: java-backend
        directionLabel:
          type: [string, "null"]
          example: Java 后端
        resumeId:
          type: [integer, "null"]
          format: int64
        resumeFileName:
          type: [string, "null"]
          description: 冗余展示字段
          example: 我的简历-v3.pdf
        jobPositionId:
          type: [integer, "null"]
          format: int64
        jobPositionTitle:
          type: [string, "null"]
          example: Java 后端开发工程师
        companyName:
          type: [string, "null"]
          example: 字节跳动
        status:
          $ref: '#/components/schemas/InterviewSessionStatus'
        evaluateStatus:
          $ref: '#/components/schemas/AnalyzeStatus'
        questionCount:
          type: integer
          description: 配置的主问题数量
          example: 8
        followUpCount:
          type: integer
          description: 每道主问题配置的追问数量（0 表示不追问）
          example: 1
        answeredCount:
          type: integer
          description: 已作答 + 已跳过题目数（含追问）
          example: 3
        currentProviderKey:
          type: [string, "null"]
          example: corp-gateway
        currentModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InterviewSessionDetail:
      allOf:
        - $ref: '#/components/schemas/InterviewSession'
        - type: object
          properties:
            error:
              type: [string, "null"]
              description: 出题失败原因（截断至 500 字）
            retryCount:
              type: integer
              description: 出题已自动重试次数，上限 3
              example: 0
            evaluateError:
              type: [string, "null"]
              description: 评估失败原因（截断至 500 字）
            evaluateRetryCount:
              type: integer
              description: 评估已自动重试次数，上限 3
              example: 0
            questions:
              type: array
              description: 已生成的题目，按 questionIndex 升序；出题中可能不完整
              items:
                $ref: '#/components/schemas/InterviewQuestion'

    CreateInterviewSessionRequest:
      type: object
      properties:
        direction:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,63}$'
          description: 面试方向 key（来自 `GET /api/interview/directions`）；与 jobPositionId 至少填一个
          example: java-backend
        resumeId:
          type: [integer, "null"]
          format: int64
          description: 关联简历；填了则简历题约 60%
        jobPositionId:
          type: [integer, "null"]
          format: int64
          description: 关联岗位 JD；与 direction 至少填一个
        questionCount:
          type: integer
          minimum: 5
          maximum: 15
          default: 8
          description: 主问题数量
        followUpCount:
          type: integer
          minimum: 0
          maximum: 3
          default: 1
          description: 每道主问题的追问数量，0 表示不追问
        providerKey:
          type: string
          description: 省略时按 `INTERVIEW_QUESTION` 场景绑定取值，未绑定则回落全局默认；与 `model` 需同时提供
        model:
          type: string
          description: 与 `providerKey` 需同时提供

    AnswerInterviewQuestionRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 5000

    InterviewEvaluationCategory:
      type: object
      required: [key, label, score]
      properties:
        key:
          type: string
          description: 分类标识（由出题方向的知识体系定义）
          example: java-basics
        label:
          type: string
          example: Java 基础
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 78

    InterviewEvaluation:
      type: object
      required: [status, retryCount, categories, strengths, improvements]
      properties:
        status:
          $ref: '#/components/schemas/AnalyzeStatus'
        error:
          type: [string, "null"]
          description: 评估失败原因（截断至 500 字）
        retryCount:
          type: integer
          description: 评估已自动重试次数，上限 3
          example: 0
        overallScore:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: 总分（本地按分类得分加权计算），未完成时 null
          example: 76
        categories:
          type: array
          description: 分类得分；评估未完成时为空数组
          items:
            $ref: '#/components/schemas/InterviewEvaluationCategory'
        strengths:
          type: array
          items:
            type: string
        improvements:
          type: array
          items:
            type: string
        summary:
          type: [string, "null"]
          description: 整体评语
        llmProvider:
          type: [string, "null"]
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        evaluatedAt:
          type: [string, "null"]
          format: date-time
          description: 评估完成时间；未完成时为 null

    ResultInterviewDirectionList:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InterviewDirection'

    ResultInterviewSession:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewSession'

    ResultInterviewSessionDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewSessionDetail'

    ResultInterviewSessionPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/InterviewSession'

    ResultInterviewQuestion:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewQuestion'

    ResultInterviewEvaluation:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InterviewEvaluation'

    # ---------- Offer 决策 F6（M2 第二批） ----------

    OfferGroup:
      type: string
      description: 保留组 / 淘汰组；保留组最多 4 个
      enum: [KEEP, DROP]

    OfferTendency:
      type: string
      description: 值得接受 / 需要确认 / 建议放弃
      enum: [ACCEPT, CONFIRM, DECLINE]

    OfferAnalysis:
      type: object
      required: [tendency, reasons, prospect, risks, sources, basedOnProvidedMaterials, analyzedAt]
      properties:
        tendency:
          $ref: '#/components/schemas/OfferTendency'
        reasons:
          type: array
          description: 倾向理由
          items:
            type: string
        prospect:
          type: string
          description: 公司 / 岗位前景与成长空间分析
        risks:
          type: array
          description: 风险与需要确认的点
          items:
            type: string
        sources:
          type: array
          description: 联网搜索来源；未开启联网时为空数组
          items:
            type: string
        basedOnProvidedMaterials:
          type: boolean
          description: true 表示结论仅基于用户提供的资料（未联网）
        llmProvider:
          type: [string, "null"]
          example: corp-gateway
        llmModel:
          type: [string, "null"]
          example: Qwen3.8-27B
        analyzedAt:
          type: string
          format: date-time

    Offer:
      type: object
      required: [id, group, benefits, allowances, finalChoice, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: [integer, "null"]
          format: int64
        companyName:
          type: [string, "null"]
          description: 冗余展示字段
          example: 字节跳动
        jobPositionId:
          type: [integer, "null"]
          format: int64
        applicationId:
          type: [integer, "null"]
          format: int64
          description: 关联的投递记录（同一岗位多次投递时用于区分）
        jobPositionTitle:
          type: [string, "null"]
          example: Java 后端开发工程师
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
          description: 月薪总额（元/月）
          example: 30000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
          description: 底薪（元/月）
          example: 24000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
          description: 绩效占比（%）
          example: 20
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
          description: 五险一金缴纳基数（原文，如“12000”或“按最低基数”）
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
          description: 五险一金缴纳比例（原文，如“10.5%”）
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
          description: 公积金缴纳基数（原文）
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
          description: 公积金缴纳比例（原文，如“12%”）
        twoDayWeekend:
          type: [boolean, "null"]
          description: 是否双休；null 表示未填写
        workHours:
          type: [string, "null"]
          maxLength: 64
          description: 上下班时间
          example: 10:00-19:00
        benefits:
          type: array
          description: 福利（如餐补、房补、免费班车）
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          description: 各项补贴
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
          description: 年终奖（原文，如“3 个月”）
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
          description: 季度奖（原文）
        remark:
          type: [string, "null"]
          maxLength: 500
        group:
          $ref: '#/components/schemas/OfferGroup'
        decisionPriorities:
          type: [string, "null"]
          maxLength: 1000
          description: 决策依据快照：当时看重什么
        finalChoice:
          type: boolean
          description: 是否为最终选择；标记后其他 Offer 自动取消
        finalChoiceReason:
          type: [string, "null"]
          maxLength: 1000
          description: 最终选择及原因
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OfferDetail:
      allOf:
        - $ref: '#/components/schemas/Offer'
        - type: object
          properties:
            analysis:
              oneOf:
                - $ref: '#/components/schemas/OfferAnalysis'
                - type: "null"
              description: 最近一次前景 / 倾向分析；未分析时为 null

    CreateOfferRequest:
      type: object
      description: |
        `companyId` 与 `jobPositionId` 至少填一个；仅填 jobPositionId 时自动带出所属公司。
        `applicationId` 可选，提供时必须存在；其余字段均为可选，缺失的对比维度统一显示「未填写」。
      properties:
        companyId:
          type: [integer, "null"]
          format: int64
        jobPositionId:
          type: [integer, "null"]
          format: int64
        applicationId:
          type: [integer, "null"]
          format: int64
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
        twoDayWeekend:
          type: [boolean, "null"]
        workHours:
          type: [string, "null"]
          maxLength: 64
        benefits:
          type: array
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
        remark:
          type: [string, "null"]
          maxLength: 500
        group:
          $ref: '#/components/schemas/OfferGroup'
        decisionPriorities:
          type: [string, "null"]
          maxLength: 1000
        finalChoice:
          type: [boolean, "null"]
        finalChoiceReason:
          type: [string, "null"]
          maxLength: 1000

    UpdateOfferRequest:
      type: object
      description: |
        全部字段可选：不传表示不修改，传 `null` 表示清空。
        移动到保留组时若除当前 Offer 外已有 4 个保留 Offer，返回 409 / 40914。
      properties:
        companyId:
          type: [integer, "null"]
          format: int64
        jobPositionId:
          type: [integer, "null"]
          format: int64
        applicationId:
          type: [integer, "null"]
          format: int64
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
        twoDayWeekend:
          type: [boolean, "null"]
        workHours:
          type: [string, "null"]
          maxLength: 64
        benefits:
          type: array
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
        remark:
          type: [string, "null"]
          maxLength: 500
        group:
          $ref: '#/components/schemas/OfferGroup'
        decisionPriorities:
          type: [string, "null"]
          maxLength: 1000
        finalChoice:
          type: [boolean, "null"]
        finalChoiceReason:
          type: [string, "null"]
          maxLength: 1000

    OfferExtraction:
      type: object
      description: LLM 从文本 / 图片提取的 Offer 草稿，所有字段均可能为 null，由用户修正后再保存。
      properties:
        companyName:
          type: [string, "null"]
          maxLength: 128
        jobPositionTitle:
          type: [string, "null"]
          maxLength: 128
        monthlySalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        baseSalary:
          type: [integer, "null"]
          minimum: 0
          maximum: 10000000
        performanceRatio:
          type: [number, "null"]
          minimum: 0
          maximum: 100
        socialInsuranceBase:
          type: [string, "null"]
          maxLength: 64
        socialInsuranceRatio:
          type: [string, "null"]
          maxLength: 32
        housingFundBase:
          type: [string, "null"]
          maxLength: 64
        housingFundRatio:
          type: [string, "null"]
          maxLength: 32
        twoDayWeekend:
          type: [boolean, "null"]
        workHours:
          type: [string, "null"]
          maxLength: 64
        benefits:
          type: array
          items:
            type: string
            maxLength: 64
        allowances:
          type: array
          items:
            type: string
            maxLength: 64
        annualBonus:
          type: [string, "null"]
          maxLength: 64
        quarterlyBonus:
          type: [string, "null"]
          maxLength: 64
        remark:
          type: [string, "null"]
          maxLength: 500

    AnalyzeOfferRequest:
      type: object
      properties:
        webSearch:
          type: boolean
          default: false
          description: 是否联网搜索补充公司 / 岗位信息；默认关闭，需当前 Provider 支持

    OfferComparisonColumn:
      type: object
      required: [offerId, companyName, jobPositionTitle]
      properties:
        offerId:
          type: integer
          format: int64
        companyName:
          type: [string, "null"]
        jobPositionTitle:
          type: [string, "null"]

    OfferComparisonRow:
      type: object
      required: [key, label, values]
      properties:
        key:
          type: string
          description: 固定维度标识；行顺序固定，不随 Offer 变化
          enum:
            - monthlySalary
            - baseSalary
            - performanceRatio
            - socialInsurance
            - housingFund
            - twoDayWeekend
            - workHours
            - benefits
            - allowances
            - annualBonus
            - quarterlyBonus
            - remark
        label:
          type: string
          example: 月薪
        values:
          type: array
          description: 与 `columns` 顺序一一对应；缺失统一为「未填写」
          items:
            type: string

    OfferComparison:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          description: 保留组 Offer（最多 4 个）
          items:
            $ref: '#/components/schemas/OfferComparisonColumn'
        rows:
          type: array
          description: 固定维度与固定顺序的对比矩阵
          items:
            $ref: '#/components/schemas/OfferComparisonRow'

    ResultOfferDetail:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferDetail'

    ResultOfferPage:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Offer'

    ResultOfferExtraction:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferExtraction'

    ResultOfferAnalysis:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferAnalysis'

    ResultOfferComparison:
      allOf:
        - $ref: '#/components/schemas/ResultVoid'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OfferComparison'

    # ---------- M3 1.9.0：投递档案 / 真实面试复盘 / 改进闭环 ----------

    JobApplicationStatus:
      type: string
      description: 投递状态
      enum: [APPLIED, INTERVIEWING, OFFERED, REJECTED, WITHDRAWN]

    InterviewRoundType:
      type: string
      description: 真实面试轮次类型
      enum: [HR, TECH, CROSS, DIRECTOR, FINAL, OTHER]

    InterviewFormat:
      type: string
      description: 面试形式
      enum: [PHONE, VIDEO, ONSITE, OTHER]

    InterviewResult:
      type: string
      description: 面试结果
      enum: [PASS, FAIL, PENDING]

    ReviewInputType:
      type: string
      description: 复盘输入类型
      enum: [AUDIO, TEXT, NOTES]

    ReviewStageStatus:
      type: string
      description: ASR / 分析阶段状态
      enum: [PENDING, PROCESSING, COMPLETED, FAILED, SKIPPED]

    ReviewStatus:
      type: string
      description: 复盘整体状态（由 ASR 与分析阶段派生）
      enum: [UPLOADED, TRANSCRIBING, ANALYZING, READY, FAILED]

    ImprovementActionStatus:
      type: string
      description: 改进行动状态
      enum: [TODO, IN_PROGRESS, VERIFIED, DROPPED]

    JobApplicationListItem:
      type: object
      required: [id, jobPositionId, status, appliedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        jobPositionId:
          type: integer
          format: int64
        jobTitle:
          type: [string, "null"]
          example: Java 后端开发工程师
        companyId:
          type: [integer, "null"]
          format: int64
        companyName:
          type: [string, "null"]
          example: 字节跳动
        resumeId:
          type: [integer, "null"]
          format: int64
        resumeFileName:
          type: [string, "null"]
          description: 冗余展示字段
          example: 我的简历-v3.pdf
        channel:
          type: [string, "null"]
          maxLength: 64
          description: 投递渠道（如 BOSS / 官网 / 内推）
          example: BOSS
        appliedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/JobApplicationStatus'
        outcome:
          type: [string, "null"]
          maxLength: 500
          description: 结果备注（如简历淘汰 / 二面后无回复）
        notes:
          type: [string, "null"]
          maxLength: 2000
        interviewCount:
          type: integer
          minimum: 0
          description: 关联的真实面试轮次数
          example: 2
        latestRoundNo:
          type: [integer, "null"]
          minimum: 1
          description: 最近一轮的轮次号
          example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateJobApplicationRequest:
      type: object
      required: [jobPositionId]
      properties:
        jobPositionId:
          type: integer
          format: int64
        resumeId:
          type: [integer, "null"]
          format: int64
          description: 使用的简历版本；为空时使用当前默认简历
        channel:
          type: [string, "null"]
          maxLength: 64
        appliedAt:
          type: [string, "null"]
          format: date-time
          description: 投递时间；为空时取当前时间
        status:
          $ref: '#/components/schemas/JobApplicationStatus'
          description: 初始状态；为空时默认 APPLIED，用于补录历史投递
        outcome:
          type: [string, "null"]
          maxLength: 500
          description: 结果备注（如简历淘汰 / 面试淘汰）；补录历史投递时可直接填写
        notes:
          type: [string, "null"]
          maxLength: 2000

    UpdateJobApplicationRequest:
      type: object
      properties:
        resumeId:
          type: [integer, "null"]
          format: int64
        channel:
          type: [string, "null"]
          maxLength: 64
        appliedAt:
          type: [string, "null"]
          format: date-time
        status:
          $ref: '#/components/schemas/JobApplicationStatus'
        outcome:
          type: [string, "null"]
