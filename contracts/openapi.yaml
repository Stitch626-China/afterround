  /api/review-sessions:
    get:
      tags: [真实面试复盘]
      operationId: listReviewSessions
      summary: 复盘记录分页列表
      description: |
        - `keyword` 检索转写 / 笔记（PostgreSQL 全文检索 + 模糊匹配兜底）与公司名 / 岗位名；
          命中转写 / 笔记时列表项返回 `matchSnippet`（约 300 字上下文），公司 / 岗位命中不返回片段。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReviewStatus'
        - name: applicationId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          required: false
          description: 关键词（≤64 字），检索转写 / 笔记 / 公司名 / 岗位名
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewSessionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [真实面试复盘]
      operationId: createReviewSession
      summary: 创建复盘记录（音频 / 转写 / 笔记三选一）
      description: |
        - `audio`、`transcript`、`notes` 三选一，不可同时为空。
        - 已有投递或岗位时提供 `applicationId` / `jobPositionId`；服务端自动创建或复用面试轮次。
        - 尚无岗位记录时可快速录入：提供 `companyId` 或 `companyName`（二选一）与 `jobTitle`，
          服务端复用或新建公司，并创建来源为 `MANUAL` 的岗位、投递与面试轮次；手动录入岗位不参与行情统计。
        - `companyId` / `companyName` / `jobTitle` 仅在未提供 `applicationId` 与 `jobPositionId` 时生效。
        - 可选补充 `companyIntro`、`jdText`、`resumeId` 作为分析背景：公司介绍与 JD 会落库，
          简历版本会关联到本次投递；不提供也能创建。
        - 创建后返回 `status = UPLOADED`；音频走异步 ASR，随后异步分析；轮询 `/status`。
        - 音频支持 mp3 / wav / m4a，≤100MB 或 2 小时；转写失败可改用文本重新创建。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [roundNo, roundType]
              properties:
                audio:
                  type: string
                  format: binary
                  description: 面试录音（与 transcript / notes 三选一）
                transcript:
                  type: string
                  maxLength: 200000
                  description: 已有转写文本（与 audio / notes 三选一）
                notes:
                  type: string
                  maxLength: 20000
                  description: 手动笔记（与 audio / transcript 三选一）
                applicationId:
                  type: integer
                  format: int64
                  description: 投递记录 ID；与 jobPositionId 至少提供一个
                jobPositionId:
                  type: integer
                  format: int64
                  description: 岗位 ID；用于没有投递记录时的快速录入
                companyId:
                  type: integer
                  format: int64
                  description: 已有公司 ID；与 companyName 二选一，仅在快速新建岗位时使用
                companyName:
                  type: string
                  maxLength: 128
                  description: 公司名称；按精确同名复用，不存在时自动创建
                jobTitle:
                  type: string
                  maxLength: 128
                  description: 快速新建的岗位名；与 companyId / companyName 配合使用
                companyIntro:
                  type: string
                  maxLength: 10000
                  description: 公司介绍（可选背景）；新建公司时保存，已有公司为空时补全
                jdText:
                  type: string
                  maxLength: 200000
                  description: 岗位 JD 文本（可选背景）；快速新建岗位时保存为 JD 原文
                resumeId:
                  type: integer
                  format: int64
                  description: 本次面试使用的简历版本；关联投递并作为分析背景
                roundNo:
                  type: integer
                  minimum: 1
                  description: 轮次号，从 1 开始
                roundType:
                  $ref: '#/components/schemas/InterviewRoundType'
                interviewerRole:
                  type: string
                  maxLength: 64
                  description: 面试官角色（如技术负责人 / HRBP）
                format:
                  $ref: '#/components/schemas/InterviewFormat'
                interviewTime:
                  type: string
                  format: date-time
                idempotencyKey:
                  type: string
                  maxLength: 64
                  description: 客户端幂等键，网络重试时避免重复创建
      responses:
        '200':
          description: 创建成功，转写 / 分析进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 该投递的轮次已存在复盘记录（40917）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '413':
          description: 音频超过 100MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '415':
          description: 不支持的音频格式
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/review-sessions/{reviewSessionId}:
