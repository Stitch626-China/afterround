        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/review-sessions/{reviewSessionId}/analyze:
    parameters:
      - $ref: '#/components/parameters/ReviewSessionId'
    post:
      tags: [真实面试复盘]
      operationId: analyzeReviewSession
      summary: 触发 / 重新触发复盘分析
      description: |
        - 转写或笔记已就绪时可用；ASR 未完成时返回 409（40915）。
        - 支持修正转写后重新分析；重新分析覆盖原分析结果。
      responses:
        '200':
          description: 已触发，分析进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 复盘任务执行中（40915）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/review-sessions/{reviewSessionId}/transcribe:
    parameters:
      - $ref: '#/components/parameters/ReviewSessionId'
    post:
      tags: [真实面试复盘]
      operationId: transcribeReviewSession
      summary: 重试语音转写（ASR 失败后）
      description: |
        - 仅音频复盘可用；转写已完成返回 400，ASR / 分析执行中返回 409（40915）。
        - 成功后自动进入分析；未配置 ASR 或音频文件缺失时返回 400。
      responses:
        '200':
          description: 已重新触发，转写进行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 复盘任务执行中（40915）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/review-sessions/{reviewSessionId}/analysis:
    parameters:
      - $ref: '#/components/parameters/ReviewSessionId'
    put:
      tags: [真实面试复盘]
      operationId: updateReviewAnalysis
      summary: 确认 / 修正结构化分析（含接受改进行动）
      description: |
        - 用完整 payload 覆盖可编辑字段：问题与回答摘要、评分、标签、总结、改进行动。
        - `confirmed = true` 表示确认完成，并据 `actions` 创建 / 更新改进行动。
        - 分析未完成时返回 409（40916）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewAnalysisUpdateRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewSessionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 复盘分析尚未完成，无法确认（40916）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

