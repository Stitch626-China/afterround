  /api/review-sessions/{reviewSessionId}/audio:
    parameters:
      - $ref: '#/components/parameters/ReviewSessionId'
    delete:
      tags: [真实面试复盘]
      operationId: clearReviewSessionAudio
      summary: 清理复盘音频（保留转写与分析）
      description: |
        - NFR7：分析完成（`analyzeStatus = COMPLETED`）后可删除磁盘音频释放空间；
          转写文本、结构化分析与改进动作全部保留。
        - 仅音频复盘且音频仍存在时可用；非音频复盘、已清理或分析未完成返回 400。
        - 转写 / 分析执行中返回 409（40915）；清理后不可再重试转写。
      responses:
        '200':
          description: 清理成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 复盘任务执行中（40915）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/review-sessions/{reviewSessionId}/status:
    parameters:
      - $ref: '#/components/parameters/ReviewSessionId'
    get:
      tags: [真实面试复盘]
      operationId: getReviewSessionStatus
      summary: 轻量状态轮询（ASR / 分析）
      description: 只返回状态、错误与重试次数，不返回转写全文与分析结果。
      responses:
        '200':
          description: 成功
          content:
