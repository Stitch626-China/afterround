  /api/job-applications/{applicationId}/timeline:
    parameters:
      - $ref: '#/components/parameters/ApplicationId'
    get:
      tags: [投递档案]
      operationId: getJobApplicationTimeline
      summary: 投递时间线（投递 + 面试 + 复盘 + Offer + 改进动作）
